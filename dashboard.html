      <td>${escapeHtml(r.reason || "—")}</td>
    </tr>`).join("");
  return `<div class="hero-label" style="margin-top:14px;">Remarks</div>
    <div style="overflow-x:auto; margin-top:6px;"><table>
      <thead><tr><th>Date</th><th class="num">DT Start</th><th class="num">DT End</th><th>Reason</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>`;
}

function parseScoreboard(values) {
  const header = findHeaderRow(values);
  if (!header) throw new Error("Couldn't find a header row in the scoreboard tab (looking for columns like Date, Internet, Access Points, Switches, CCTV, Biometrics, Uptime).");
  const rows = [];
  for (let r = header.rowIdx + 1; r < values.length; r++) {
    const row = values[r];
    const dateRaw = header.cols.date !== undefined ? row[header.cols.date] : "";
    if (!dateRaw) continue;
    rows.push({
      date: String(dateRaw),
      internet: header.cols.internet !== undefined ? parseNumber(row[header.cols.internet]) : null,
      ap: header.cols.ap !== undefined ? parseNumber(row[header.cols.ap]) : null,
      switches: header.cols.switches !== undefined ? parseNumber(row[header.cols.switches]) : null,
      cctv: header.cols.cctv !== undefined ? parseNumber(row[header.cols.cctv]) : null,
      bio: header.cols.bio !== undefined ? parseNumber(row[header.cols.bio]) : null,
      totalDT: header.cols.totalDT !== undefined ? parseNumber(row[header.cols.totalDT]) : null,
      uptimePct: header.cols.uptime !== undefined ? parsePercent(row[header.cols.uptime]) : null,
      // Business-hours average ISP throughput (Mbps), captured nightly alongside
      // downtime -- UniFi's own reported numbers, not an active speed test.
      towerDownMbps: header.cols.towerDown !== undefined ? parseNumber(row[header.cols.towerDown]) : null,
      towerUpMbps: header.cols.towerUp !== undefined ? parseNumber(row[header.cols.towerUp]) : null,
      marilaoDownMbps: header.cols.marilaoDown !== undefined ? parseNumber(row[header.cols.marilaoDown]) : null,
      marilaoUpMbps: header.cols.marilaoUp !== undefined ? parseNumber(row[header.cols.marilaoUp]) : null,
      kalayaanDownMbps: header.cols.kalayaanDown !== undefined ? parseNumber(row[header.cols.kalayaanDown]) : null,
      kalayaanUpMbps: header.cols.kalayaanUp !== undefined ? parseNumber(row[header.cols.kalayaanUp]) : null,
    });
  }
  return rows;
}

// ---------------------------------------------------------------------------
// Parse RawStatusLog for a "live status right now" snapshot: take the most
// recent timestamp per device, count online/offline by category, and keep
// the per-device detail (name, host, IP, status) so a card can be clicked
// to show exactly which devices are in that category.
// ---------------------------------------------------------------------------
// poll_devices.py writes Access Point/Switch rows; ping_devices.py writes
// CCTV/Biometrics rows -- they run as separate GitHub Actions workflows on
// their own schedules, so their "last ran at" timestamps are tracked
// separately rather than as one combined value.
const POLL_TYPES = new Set(["Access Point", "Switch"]);
const PING_TYPES = new Set(["CCTV", "Biometrics"]);

// Key used to match a device against the Devices-tab overrides: AP/Switch by
// MAC, CCTV/Biometrics by name (they have no MAC).
function deviceKey(type, name, mac) {
  return POLL_TYPES.has(type)
    ? `mac:${String(mac || "").toLowerCase()}`
    : `name:${String(name || "").toLowerCase()}`;
}

// Devices-tab rows with Monitored = No -> set of keys to hide everywhere.
function ignoredKeysFrom(devices) {
  const set = new Set();
  (devices || []).forEach((d) => { if (!d.monitored) set.add(deviceKey(d.type, d.name, d.mac)); });
  return set;
}

function parseLiveStatus(values, ignored) {
  if (!values || values.length < 2) return { counts: {}, devices: {}, lastPollTs: null, lastPingTs: null };
  const latestByDevice = new Map();
  let lastPollTs = null; // most recent poll_devices.py (Access Point/Switch) sample
  let lastPingTs = null; // most recent ping_devices.py (CCTV/Biometrics) sample
  for (let r = 1; r < values.length; r++) {
    const row = values[r];
    const ts = row[0], host = row[1], name = row[2], mac = row[3], type = row[4], status = row[5], ip = row[6];
    if (!ts || !type) continue;
    if (POLL_TYPES.has(type) && (!lastPollTs || ts > lastPollTs)) lastPollTs = ts;
    if (PING_TYPES.has(type) && (!lastPingTs || ts > lastPingTs)) lastPingTs = ts;
    if (ignored && ignored.has(deviceKey(type, name, mac))) continue; // removed via Manage devices
    const key = `${type}::${name}::${mac}`;
    const existing = latestByDevice.get(key);
    if (!existing || ts > existing.ts) {
      latestByDevice.set(key, {
        ts, type, name: name || "(unnamed)", host: host || "", mac: mac || "",
        ip: ip || "", status: String(status || "").toLowerCase(),
      });
    }
  }
  // Drop devices whose latest row isn't from the most recent poll/ping batch.
  // poll_devices.py and ping_devices.py each write every currently-known
  // device with one shared timestamp per run, so a device that's been
  // removed/unadopted in UniFi simply stops appearing in new batches --
  // its last row just sits in the sheet forever with an ever-staler
  // timestamp. Without this check that stale row would keep counting as
  // "live" even though UniFi no longer reports the device at all.
  const counts = {};
  const devices = {};
  latestByDevice.forEach((d) => {
    if (POLL_TYPES.has(d.type) && d.ts !== lastPollTs) return;
    if (PING_TYPES.has(d.type) && d.ts !== lastPingTs) return;
    if (!counts[d.type]) counts[d.type] = { online: 0, total: 0 };
    counts[d.type].total++;
    if (d.status === "online") counts[d.type].online++;
    if (!devices[d.type]) devices[d.type] = [];
    devices[d.type].push(d);
  });
  Object.values(devices).forEach((list) => list.sort((a, b) => a.name.localeCompare(b.name)));
  return { counts, devices, lastPollTs, lastPingTs };
}

// ---------------------------------------------------------------------------
// Roll daily rows up into monthly / quarterly / yearly periods. Downtime
// minutes sum across the period; uptime % is the simple average of the
// days that have a value (matches how the scorecard treats each business
// day as one equally-weighted sample).
// ---------------------------------------------------------------------------
function periodKeyAndLabel(dateStr, granularity) {
  const d = new Date(`${dateStr}T00:00:00`);
  if (isNaN(d)) return null;
  const y = d.getFullYear(), m = d.getMonth();
  if (granularity === "weekly") {
    // Fiscal-style "13-week quarter": week 1 starts on the first day of the
    // quarter, so each quarter buckets into (up to) 13 weekly periods --
    // matches how a quarterly uptime target is usually tracked week-by-week.
    const q = Math.floor(m / 3) + 1;
    const quarterStart = new Date(y, (q - 1) * 3, 1);
    const daysSinceQuarterStart = Math.round((d - quarterStart) / 86400000);
    const weekNum = Math.floor(daysSinceQuarterStart / 7) + 1;
    return { key: `${y}-Q${q}-W${String(weekNum).padStart(2, "0")}`, label: `Q${q} ${y} · Week ${weekNum}` };
  }
  if (granularity === "monthly") {
    return { key: `${y}-${String(m + 1).padStart(2, "0")}`, label: d.toLocaleDateString(undefined, { month: "long", year: "numeric" }) };
  }
  if (granularity === "quarterly") {
    const q = Math.floor(m / 3) + 1;
    return { key: `${y}-Q${q}`, label: `Q${q} ${y}` };
  }
  if (granularity === "yearly") {
    return { key: `${y}`, label: `${y}` };
  }
  return { key: dateStr, label: dateStr }; // daily
}

function aggregateRows(rows, granularity) {
  if (granularity === "daily") return rows;

  const groups = new Map();
  const numericFields = ["internet", "ap", "switches", "cctv", "bio", "totalDT"];

  rows.forEach((r) => {
    const period = periodKeyAndLabel(r.date, granularity);
    if (!period) return;
    if (!groups.has(period.key)) {
      groups.set(period.key, {
        key: period.key, date: period.label,
        internet: 0, ap: 0, switches: 0, cctv: 0, bio: 0, totalDT: 0,
        _hasAnyMinutes: false, _uptimeSum: 0, _uptimeCount: 0, _dailyRows: [],
      });
    }
    const g = groups.get(period.key);
    numericFields.forEach((f) => {
      if (r[f] !== null && r[f] !== undefined) {
        g[f] += r[f];
        g._hasAnyMinutes = true;
      }
    });
    if (r.uptimePct !== null && r.uptimePct !== undefined) {
      g._uptimeSum += r.uptimePct;
      g._uptimeCount += 1;
    }
    g._dailyRows.push(r);
  });

  return Array.from(groups.values())
    .sort((a, b) => a.key.localeCompare(b.key))
    .map((g) => ({
      key: g.key,
      date: g.date,
      dailyRows: g._dailyRows.slice().sort((a, b) => a.date.localeCompare(b.date)),
      internet: g._hasAnyMinutes ? g.internet : null,
      ap: g._hasAnyMinutes ? g.ap : null,
      switches: g._hasAnyMinutes ? g.switches : null,
      cctv: g._hasAnyMinutes ? g.cctv : null,
      bio: g._hasAnyMinutes ? g.bio : null,
      totalDT: g._hasAnyMinutes ? g.totalDT : null,
      uptimePct: g._uptimeCount ? g._uptimeSum / g._uptimeCount : null,
      sampleDays: g._uptimeCount,
    }));
}

// ---------------------------------------------------------------------------
// Rendering
// ---------------------------------------------------------------------------
function fmtMin(n) {
  if (n === null || n === undefined || isNaN(n)) return "—";
  return `${n.toFixed(1)}m`;
}
function fmtPct(n) {
  if (n === null || n === undefined || isNaN(n)) return "—";
  return `${n.toFixed(2)}%`;
}
// Business-hours average ISP throughput, captured nightly per site alongside
// downtime (Scoreboard columns K-N). UniFi's own reported numbers, not an
// active speed test.
function fmtSpeed(down, up) {
  if (down === null || down === undefined || up === null || up === undefined) return "—";
  return `${down}/${up} Mbps`;
}

function fmtSpeedAvg(down, up) {
  // Average speed = (download + upload) / 2
  if (down === null || down === undefined || up === null || up === undefined) return "—";
  return `${Math.round(((down + up) / 2) * 10) / 10} Mbps`;
}

let expandedCategory = null; // persists across re-renders (filter clicks, reloads)

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function renderLiveStatus(liveStatus) {
  const { counts = {}, devices = {} } = liveStatus || {};
  const cats = ["Access Point", "Switch", "CCTV", "Biometrics"];
  const cards = cats.map((cat) => {
    const d = counts[cat];
    if (!d) {
      return `<button type="button" class="card live-card" disabled>
        <div class="label">${cat}</div>
        <div class="value" style="color:var(--text-mute); font-size:14px;">No data yet</div>
      </button>`;
    }
    const allOnline = d.online === d.total;
    const color = allOnline ? "var(--sg)" : (d.online === 0 ? "var(--red)" : "var(--yellow)");
    const isExpanded = expandedCategory === cat;
    return `<button type="button" class="card live-card ${isExpanded ? "expanded" : ""}" data-toggle-category="${cat}">
      <div class="label">${cat}</div>
      <div class="value" style="color:${color}">${d.online}<span style="font-size:18px; color:var(--text-mute); font-weight:600;">/${d.total}</span></div>
      <div class="mini-bar"><span style="width:${d.total ? (d.online / d.total * 100).toFixed(1) : 0}%; background:${color};"></span></div>
      <div class="sub-value">${d.total - d.online ? `${d.total - d.online} offline` : "all online"} &middot; click for details</div>
    </button>`;
  });

  let detailPanel = "";
  if (expandedCategory && devices[expandedCategory]) {
    const rows = devices[expandedCategory].map((dev) => {
      const statusColor = dev.status === "online" ? "var(--sg)" : "var(--red)";
      return `<tr>
        <td>${escapeHtml(dev.name)}</td>
        <td>${escapeHtml(dev.host) || "—"}</td>
        <td class="mono">${escapeHtml(dev.ip) || "—"}</td>
        <td><span style="color:${statusColor}">${escapeHtml(dev.status)}</span></td>
      </tr>`;
    }).join("");
    detailPanel = `<div class="device-panel">
      <table>
        <thead><tr><th>Device Name</th><th>Host</th><th>IP Address</th><th>Status</th></tr></thead>
        <tbody>${rows || `<tr><td colspan="4" class="msg">No devices found for this category.</td></tr>`}</tbody>
      </table>
    </div>`;
  }

  return `<div class="grid">${cards.join("")}</div>${detailPanel}`;
}

// Live status tiles + topology map in one highlighted card.
function renderLiveNetwork(liveStatus, latestRow) {
  return `<section class="featured topo-section">
    <h2>Live network <span class="live-pill"><span class="live-dot"></span>LIVE</span></h2>
    <div class="section-note">
      Real device status from your UniFi consoles and the BK Tower ping job, refreshed every ~10 minutes. Point at a ring
      in the map to see the devices behind it. This is separate from the downtime numbers in the
      reports below, which are calculated nightly and only count business hours (Mon&ndash;Fri, 8:00 AM&ndash;5:30 PM).
    </div>
    ${renderTopology(liveStatus, latestRow)}
    <div class="section-note" style="margin:12px 0 0;">Gateway rings combine everything behind them. ISP throughput is UniFi's reported
      business-hours average (Mbps) for the latest day &mdash; not a speed test.</div>
  </section>`;
}

// ---------------------------------------------------------------------------
// Live network topology -- same RawStatusLog device data as Live status
// above, but laid out as the real two-site network path and colored by
// current online/offline status per node. Site is inferred from the "host"
// field: poll_devices.py writes real UniFi host names (e.g.
// "BKPI_Tower_Shadow", "BKPI_MarilaoWhse"); ping_devices.py always writes
// "BK Tower Shadow" since CCTV/Biometrics only exist at that site. Matching
// is a simple case-insensitive substring check, not an exact key, so it
// keeps working even if the exact host string format changes slightly.
// ---------------------------------------------------------------------------
function siteOf(hostStr) {
  const h = String(hostStr || "").toLowerCase();
  if (h.includes("tower")) return "tower";
  if (h.includes("marilao")) return "marilao";
  if (h.includes("kalayaan")) return "kalayaan";
  return null;
}

function siteNodeStats(devices, category, site) {
  const list = (devices[category] || []).filter((d) => siteOf(d.host) === site);
  const online = list.filter((d) => d.status === "online").length;
  return { online, total: list.length };
}

function topoColor(stats) {
  if (stats.total === 0) return "var(--text-mute)";
  if (stats.online === stats.total) return "var(--sg)";
  if (stats.online === 0) return "var(--red)";
  return "var(--yellow)";
}

function topoCountLabel(stats) {
  return stats.total === 0 ? "no data" : `${stats.online}/${stats.total} online`;
}

function topoNode(x, y, w, h, title, sub, color) {
  const cx = x + w / 2;
  const titleY = sub ? y + h / 2 - 9 : y + h / 2;
  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="8" fill="var(--panel-2)" stroke="${color}" stroke-width="1.5"/>
    <text x="${cx}" y="${titleY}" text-anchor="middle" dominant-baseline="central" style="font-size:13px; font-weight:600; fill:var(--text);">${escapeHtml(title)}</text>
    ${sub ? `<text x="${cx}" y="${y + h / 2 + 12}" text-anchor="middle" dominant-baseline="central" style="font-size:11px; fill:${color};">${escapeHtml(sub)}</text>` : ""}`;
}

// Latest business-hours average throughput for each ISP, as captured
// nightly by aggregate_daily.py into the Scoreboard's Tower/Marilao Down
// and Up (Mbps) columns. This is UniFi's own reported throughput, not an
// active speed test -- the cloud API doesn't run one.
function fmtSpeedSub(down, up) {
  if (down === null || down === undefined || up === null || up === undefined) return null;
  return `${down}/${up} Mbps down/up`;
}

function renderTopology(liveStatus, latestRow) {
  const devices = (liveStatus && liveStatus.devices) || {};
  const st = (cat, site) => siteNodeStats(devices, cat, site);
  const sum = (...xs) => xs.reduce((o, x) => ({ online: o.online + x.online, total: o.total + x.total }), { online: 0, total: 0 });

  const T = { ap: st("Access Point", "tower"), sw: st("Switch", "tower"), cctv: st("CCTV", "tower"), bio: st("Biometrics", "tower") };
  const M = { ap: st("Access Point", "marilao"), sw: st("Switch", "marilao") };
  const K = { ap: st("Access Point", "kalayaan"), sw: st("Switch", "kalayaan") };
  T.gw = sum(T.ap, T.sw, T.cctv, T.bio); M.gw = sum(M.ap, M.sw); K.gw = sum(K.ap, K.sw);

  const speed = (d, u) => fmtSpeedSub(latestRow ? latestRow[d] : null, latestRow ? latestRow[u] : null);
  // Latest day that has UniFi's business-hours average traffic for this ISP.
  const traffic = (d, u) => {
    const rows = (typeof lastRows !== "undefined" && lastRows) || [];
    for (let i = rows.length - 1; i >= 0; i--) {
      const r = rows[i];
      if (r[d] !== null && r[d] !== undefined && r[u] !== null && r[u] !== undefined) return { down: r[d], up: r[u], date: r.date };
    }
    return null;
  };

  // Graph nodes: kind "isp" | "cloud" have no device count; everything else
  // shows a ring filled to its online %.
  const N = {
    cloud:  { x: 560, y: 62,  r: 26, label: "unifi.ui.com", kind: "cloud" },
    tIsp:   { x: 150, y: 150, r: 30, label: "Converge", site: "Tower Shadow", traffic: traffic("towerDownMbps", "towerUpMbps"), kind: "isp" },
    tGw:    { x: 250, y: 250, r: 34, label: "UDM SE · Tower", stats: T.gw },
    tSw:    { x: 190, y: 352, r: 30, label: "Switches", stats: T.sw },
    tAp:    { x: 80,  y: 450, r: 30, label: "APs", stats: T.ap },
    tCctv:  { x: 215, y: 470, r: 30, label: "CCTV", stats: T.cctv },
    tBio:   { x: 350, y: 440, r: 30, label: "Biometrics", stats: T.bio },
    mIsp:   { x: 560, y: 166, r: 30, label: "PT&T", site: "Marilao Warehouse", traffic: traffic("marilaoDownMbps", "marilaoUpMbps"), kind: "isp" },
    mGw:    { x: 560, y: 278, r: 34, label: "UDM SE · Marilao", stats: M.gw },
    mSw:    { x: 500, y: 382, r: 30, label: "Switches", stats: M.sw },
    mAp:    { x: 625, y: 455, r: 30, label: "Access Points", stats: M.ap },
    kIsp:   { x: 960, y: 150, r: 30, label: "Converge", site: "Kalayaan", traffic: traffic("kalayaanDownMbps", "kalayaanUpMbps"), kind: "isp" },
    kGw:    { x: 870, y: 250, r: 34, label: "UDM SE · Kalayaan", stats: K.gw },
    kSw:    { x: 930, y: 352, r: 30, label: "Switches", stats: K.sw },
    kAp:    { x: 840, y: 450, r: 30, label: "Access Points", stats: K.ap },
  };
  const health = (n) => {
    if (!n || !n.stats) return "neutral";
    if (n.stats.total === 0) return "nodata";
    if (n.stats.online === n.stats.total) return "ok";
    return n.stats.online === 0 ? "bad" : "warn";
  };
  const COL = { ok: "#4ade80", warn: "#fbbf24", bad: "#f87171", nodata: "#6b8f79", neutral: "#a3e635" };

  // Links: [from, to, dashed?]. A link takes the colour of the node it feeds.
  const L = [
    ["tIsp", "tGw"], ["tGw", "tSw"], ["tSw", "tAp"], ["tSw", "tCctv"], ["tSw", "tBio"],
    ["mIsp", "mGw"], ["mGw", "mSw"], ["mSw", "mAp"],
    ["kIsp", "kGw"], ["kGw", "kSw"], ["kSw", "kAp"],
    ["cloud", "tGw", true], ["cloud", "mGw", true], ["cloud", "kGw", true],
  ];
  const links = L.map(([f, t, dashed], i) => {
    const A = N[f], B = N[t];
    const h = dashed ? "neutral" : health(B);
    const mx = (A.x + B.x) / 2, my = (A.y + B.y) / 2;
    const bend = (i % 2 ? 1 : -1) * Math.min(40, Math.hypot(B.x - A.x, B.y - A.y) * 0.18);
    const dx = B.x - A.x, dy = B.y - A.y, len = Math.hypot(dx, dy) || 1;
    const cx = mx + (-dy / len) * bend, cy = my + (dx / len) * bend;
    const d = `M${A.x},${A.y} Q${cx},${cy} ${B.x},${B.y}`;
    const col = dashed ? "rgba(163,230,53,0.35)" : COL[h];
    const width = h === "warn" || h === "bad" ? 3 : 2;
    // Moving "packets": glowing dots that travel along each link (SVG
    // animateMotion, so they run even when the OS has animations turned down).
    // Problem links run faster so they catch the eye.
    const dur = dashed ? 4.5 : (h === "warn" || h === "bad" ? 1.6 : 2.6);
    const packets = [0, 1, 2].map((k) => `<circle r="${dashed ? 2.5 : 3.6}" fill="${dashed ? "#d9f99d" : col}" filter="url(#topo-glow)">
        <animateMotion dur="${dur}s" begin="${(-(dur / 3) * k - (i * 0.37) % dur).toFixed(2)}s" repeatCount="indefinite" path="${d}"/>
      </circle>`).join("");
    return `<path d="${d}" fill="none" stroke="${col}" stroke-opacity="${dashed ? 1 : 0.55}" stroke-width="${width}" ${dashed ? 'stroke-dasharray="3 6"' : ""}/>
      <path class="topo-flow" d="${d}" fill="none" stroke="${dashed ? "rgba(217,249,157,0.5)" : col}" stroke-width="${width}" stroke-dasharray="${dashed ? "3 9" : "10 12"}" stroke-linecap="round" style="animation-duration:${dashed ? 3 : (h === "warn" || h === "bad" ? 0.8 : 1.2)}s"/>
      ${packets}`;
  }).join("");

  // Devices behind each ring, for the hover list (offline first).
  const listFor = (cats, site) => cats.flatMap((cat) => (devices[cat] || [])
    .filter((d) => siteOf(d.host) === site).map((d) => ({ name: d.name, ip: d.ip, status: d.status, cat })))
    .sort((a, b) => (a.status === "online") - (b.status === "online") || String(a.name).localeCompare(String(b.name), undefined, { numeric: true }));
  const ALL = ["Access Point", "Switch", "CCTV", "Biometrics"];
  const lists = {
    tGw: listFor(ALL, "tower"), tSw: listFor(["Switch"], "tower"), tAp: listFor(["Access Point"], "tower"),
    tCctv: listFor(["CCTV"], "tower"), tBio: listFor(["Biometrics"], "tower"),
    mGw: listFor(ALL, "marilao"), mSw: listFor(["Switch"], "marilao"), mAp: listFor(["Access Point"], "marilao"),
    kGw: listFor(ALL, "kalayaan"), kSw: listFor(["Switch"], "kalayaan"), kAp: listFor(["Access Point"], "kalayaan"),
  };
  topoNodeInfo = {};
  Object.entries(N).forEach(([key, n]) => {
    if (n.stats) topoNodeInfo[key] = { label: n.label, stats: n.stats, devices: lists[key] || [] };
    if (n.kind === "isp") topoNodeInfo[key] = { label: `${n.label} · ${n.site}`, isp: n.traffic || {} };
  });

  const nodes = Object.entries(N).map(([key, n]) => {
    const h = health(n);
    const col = COL[h];
    const label = escapeHtml(n.label);
    const pillW = Math.max(60, n.label.length * 6.6 + 18);
    const pill = `<rect x="${n.x - pillW / 2}" y="${n.y + n.r + 8}" width="${pillW}" height="20" rx="6" fill="rgba(6,32,18,0.85)" stroke="rgba(163,230,53,0.25)"/>
      <text x="${n.x}" y="${n.y + n.r + 18}" text-anchor="middle" dominant-baseline="central" class="topo-label">${label}</text>`;
    if (!n.stats) {
      const icon = n.kind === "cloud" ? "☁" : "⇅";
      const sub = n.sub ? `<text x="${n.x}" y="${n.y + n.r + 40}" text-anchor="middle" class="topo-sub">${escapeHtml(n.sub)}</text>` : "";
      const body = `<circle cx="${n.x}" cy="${n.y}" r="${n.r}" fill="#0d3a22" stroke="${col}" stroke-width="2" stroke-opacity="0.7"/>
        <text x="${n.x}" y="${n.y}" text-anchor="middle" dominant-baseline="central" style="font-size:20px; fill:${col};">${icon}</text>
        ${pill}${sub}`;
      if (n.kind === "isp") {
        const t = n.traffic;
        const inner = t
          ? `<text x="${n.x}" y="${n.y - 8}" text-anchor="middle" dominant-baseline="central" class="topo-isp-v">↓${Math.round(t.down)}</text>
             <text x="${n.x}" y="${n.y + 9}" text-anchor="middle" dominant-baseline="central" class="topo-isp-v up">↑${Math.round(t.up)}</text>`
          : `<text x="${n.x}" y="${n.y}" text-anchor="middle" dominant-baseline="central" style="font-size:20px; fill:${col};">⇅</text>`;
        const subTxt = t ? `Mbps avg traffic` : "no traffic data yet";
        return `<g class="topo-node" data-topo-node="${key}" tabindex="0">
          <circle cx="${n.x}" cy="${n.y}" r="${n.r + 6}" fill="transparent"/>
          <circle cx="${n.x}" cy="${n.y}" r="${n.r}" fill="#0d3a22" stroke="${col}" stroke-width="2" stroke-opacity="0.8"/>
          <circle cx="${n.x}" cy="${n.y}" r="${n.r - 5}" fill="none" stroke="${col}" stroke-opacity="0.25" stroke-width="1" stroke-dasharray="2 4"/>
          ${inner}${pill}
          <text x="${n.x}" y="${n.y + n.r + 40}" text-anchor="middle" class="topo-sub">${subTxt}</text></g>`;
      }
      if (n.kind === "cloud") {
        // Opens UniFi Site Manager in a new tab; lifts and glows on hover.
        return `<a href="https://unifi.ui.com" target="_blank" rel="noopener" class="topo-cloud-link" aria-label="Open unifi.ui.com in a new tab">
          <title>Open unifi.ui.com in a new tab</title>
          <g class="topo-cloud" style="transform-origin:${n.x}px ${n.y}px;">
            <circle class="topo-cloud-glow" cx="${n.x}" cy="${n.y}" r="${n.r + 8}" fill="#a3e635" fill-opacity="0"/>
            ${body}
            <text class="topo-cloud-hint" x="${n.x}" y="${n.y + n.r + 44}" text-anchor="middle">Open ↗</text>
          </g></a>`;
      }
      return `<g><title>${label}${n.sub ? " — " + escapeHtml(n.sub) : ""}</title>${body}</g>`;
    }
    const { online, total } = n.stats;
    const pct = total ? (online / total) * 100 : 0;
    const C = 2 * Math.PI * (n.r - 4);
    const halo = (h === "warn" || h === "bad")
      ? `<circle cx="${n.x}" cy="${n.y}" r="${n.r + 10}" fill="${col}" fill-opacity="0.10" stroke="${col}" stroke-opacity="0.5" stroke-dasharray="3 4"/>
         <circle class="topo-pulse" cx="${n.x}" cy="${n.y}" r="${n.r + 4}" fill="none" stroke="${col}" stroke-width="2"/>`
      : "";
    const center = total ? `${Math.round(pct)}%` : "—";
    return `<g class="topo-node" data-topo-node="${key}" tabindex="0">
      <circle cx="${n.x}" cy="${n.y}" r="${n.r + 6}" fill="transparent"/>
      ${halo}
      <circle cx="${n.x}" cy="${n.y}" r="${n.r}" fill="#0d3a22"/>
      <circle cx="${n.x}" cy="${n.y}" r="${n.r - 4}" fill="none" stroke="rgba(255,255,255,0.10)" stroke-width="5"/>
      <circle cx="${n.x}" cy="${n.y}" r="${n.r - 4}" fill="none" stroke="${col}" stroke-width="5" stroke-linecap="round"
        stroke-dasharray="${(C * pct / 100).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 ${n.x} ${n.y})"/>
      <text x="${n.x}" y="${n.y - (total ? 3 : 0)}" text-anchor="middle" dominant-baseline="central" class="topo-pct" style="font-size:${n.r > 31 ? 15 : 13}px;">${center}</text>
      ${total ? `<text x="${n.x}" y="${n.y + 12}" text-anchor="middle" dominant-baseline="central" class="topo-count">${online}/${total}</text>` : ""}
      ${pill}</g>`;
  }).join("");

  const zone = (x, w, title) => `<rect x="${x}" y="108" width="${w}" height="452" rx="18" fill="rgba(163,230,53,0.035)" stroke="rgba(163,230,53,0.14)" stroke-dasharray="4 6"/>
    <text x="${x + 16}" y="548" class="topo-zone">${title}</text>`;

  const svg = `<svg viewBox="0 0 1040 575" width="100%" role="img" aria-label="Network topology">
    <defs>
      <filter id="topo-glow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      <pattern id="topo-grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="rgba(163,230,53,0.06)"/></pattern>
    </defs>
    <rect width="1040" height="575" fill="url(#topo-grid)"/>
    ${zone(30, 380, "TOWER SHADOW")}${zone(440, 230, "MARILAO WAREHOUSE")}${zone(700, 310, "KALAYAAN")}
    ${links}${nodes}
  </svg>`;

  // Side panel: summary tiles, per-site health bars, and what's down.
  const all = sum(T.gw, M.gw, K.gw);
  const offline = all.total - all.online;
  const linkCount = L.length;
  const sites = [["Tower Shadow", T.gw], ["Marilao Warehouse", M.gw], ["Kalayaan", K.gw]];
  const bar = ([name, x]) => {
    const pct = x.total ? (x.online / x.total) * 100 : 0;
    const h = x.total === 0 ? "nodata" : x.online === x.total ? "ok" : x.online === 0 ? "bad" : "warn";
    return `<div class="topo-site">
      <div class="topo-site-row"><span>${name}</span><strong style="color:${COL[h]};">${x.total ? Math.round(pct) + "%" : "—"}</strong></div>
      <div class="topo-bar"><span style="width:${pct.toFixed(1)}%; background:${COL[h]};"></span></div>
      <div class="topo-site-sub">${x.total ? `${x.online}/${x.total} devices online` : "no data yet"}</div>
    </div>`;
  };
  const down = ["Access Point", "Switch", "CCTV", "Biometrics"].flatMap((cat) =>
    (devices[cat] || []).filter((d) => d.status !== "online").map((d) => ({ ...d, cat })));
  const downList = down.length
    ? down.slice(0, 8).map((d) => `<li><span class="topo-dot"></span>${escapeHtml(d.name)}<em>${escapeHtml(d.cat)}</em></li>`).join("") +
      (down.length > 8 ? `<li class="more">+${down.length - 8} more</li>` : "")
    : `<li class="none">Everything is online</li>`;

  const side = `<aside class="topo-side">
    <div class="topo-side-title">Summary</div>
    <div class="topo-tiles">
      <div><span>Devices</span><strong>${all.total}</strong></div>
      <div><span>Online</span><strong style="color:${COL.ok};">${all.online}</strong></div>
      <div><span>Offline</span><strong style="color:${offline ? COL.bad : COL.ok};">${offline}</strong></div>
    </div>
    <div class="topo-side-title" style="margin-top:18px;">Sites</div>
    ${sites.map(bar).join("")}
    <div class="topo-side-title" style="margin-top:18px;">Needs attention</div>
    <ul class="topo-down">${downList}</ul>
    <div class="topo-side-foot">${linkCount} links · rings show % of devices online</div>
  </aside>`;

  return `<div class="topo-panel">
      <div class="topo-graph">${svg}<div class="topo-tip" id="topo-tip" hidden></div>
        <div class="topo-legend">
          <span><i style="background:${COL.ok}"></i>All online</span>
          <span><i style="background:${COL.warn}"></i>Some down</span>
          <span><i style="background:${COL.bad}"></i>All down</span>
          <span><i style="background:${COL.nodata}"></i>No data</span>
          <span><i style="background:${COL.neutral}"></i>ISP / cloud</span>
        </div>
      </div>
      ${side}
    </div>`;
}

// ---------------------------------------------------------------------------
// "Where are we right now" -- current quarter/week (by today's real date,
// not the data), average weekly downtime so far this quarter, and when the
// automation last actually ran (as opposed to when this browser last loaded).
// ---------------------------------------------------------------------------
function getCurrentQuarterWeek(now = new Date()) {
  const y = now.getFullYear(), m = now.getMonth();
  const q = Math.floor(m / 3) + 1;
  const quarterStart = new Date(y, (q - 1) * 3, 1);
  const daysSinceQuarterStart = Math.round((now - quarterStart) / 86400000);
  const week = Math.floor(daysSinceQuarterStart / 7) + 1;
  return { year: y, quarter: q, week, keyPrefix: `${y}-Q${q}-` };
}

function fmtDateTime(isoLike) {
  if (!isoLike) return "—";
  const d = new Date(isoLike);
  if (isNaN(d)) return String(isoLike);
  return d.toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" });
}

function computeQuarterWeeklyAverages(rows) {
  const cur = getCurrentQuarterWeek();
  const weeklyRows = aggregateRows(rows, "weekly").filter((r) => r.key.startsWith(cur.keyPrefix));
  const fields = ["internet", "ap", "switches", "cctv", "bio"];
  const out = { weeksCounted: 0 };
  let maxCount = 0;
  fields.forEach((f) => {
    const vals = weeklyRows.map((r) => r[f]).filter((v) => v !== null && v !== undefined);
    out[f] = vals.length ? vals.reduce((s, v) => s + v, 0) / vals.length : null;
    maxCount = Math.max(maxCount, vals.length);
  });
  out.weeksCounted = maxCount;
  return out;
}

// ---------------------------------------------------------------------------
// Hero card -- three columns: latest day result (left), the currently
// selected report-period's result with a breakdown of its sub-periods
// (middle -- this is what the "Report period" filter buttons drive), and
// "where are we right now" context: current quarter/week, average weekly
// downtime, and last-run timestamps (right).
// ---------------------------------------------------------------------------
function currentPeriodKey(granularity, now = new Date()) {
  const y = now.getFullYear(), m = now.getMonth();
  if (granularity === "weekly") {
    const q = Math.floor(m / 3) + 1;
    const quarterStart = new Date(y, (q - 1) * 3, 1);
    const days = Math.round((now - quarterStart) / 86400000);
    const week = Math.floor(days / 7) + 1;
    return `${y}-Q${q}-W${String(week).padStart(2, "0")}`;
  }
  if (granularity === "monthly") return `${y}-${String(m + 1).padStart(2, "0")}`;
  if (granularity === "quarterly") { const q = Math.floor(m / 3) + 1; return `${y}-Q${q}`; }
  if (granularity === "yearly") return `${y}`;
  return null;
}

function getCurrentPeriodGroup(rows, granularity) {
  const key = currentPeriodKey(granularity);
  if (!key) return null;
  return aggregateRows(rows, granularity).find((g) => g.key === key) || null;
}

// Strips the "Q3 2026 · " prefix off a weekly label when it's shown inside
// a monthly breakdown, where restating the quarter/year is redundant.
function shortWeekLabel(label) {
  const m = /Week\s*(\d+)/.exec(label);
  return m ? `Week ${m[1]}` : label;
}

function renderPeriodSummaryBlock(title, group) {
  if (!group) {
    return `<div class="hero-label">${escapeHtml(title)}</div>
      <div class="msg" style="padding:8px 0 0; text-align:left;">No data yet for this period.</div>`;
  }
  const tier = tierFor(group.uptimePct);
  return `
    <div class="hero-label">${escapeHtml(title)}</div>
    <div class="hero-value" style="margin-bottom:6px;">
      <span class="hero-pct" style="font-size:28px;">${fmtPct(group.uptimePct)}</span>
      ${tierBadge(tier)}
    </div>
    <div class="hero-sub">
      Internet ${fmtMin(group.internet)} &middot; AP ${fmtMin(group.ap)} &middot; Switches ${fmtMin(group.switches)}<br/>
      CCTV ${fmtMin(group.cctv)} &middot; Biometrics ${fmtMin(group.bio)} &middot; Total DT ${fmtMin(group.totalDT)}
    </div>`;
}

function renderBreakdownTable(label, breakdownRows) {
  if (!breakdownRows || !breakdownRows.length) {
    return `<div class="msg" style="padding:8px 0 0; text-align:left;">No ${escapeHtml(label.toLowerCase())} data yet.</div>`;
  }
  // Only real per-day rows (Weekly's day breakdown, Daily's calendar-range list)
  // carry ISP throughput -- the Week/Month/Quarter aggregate rows above them
  // don't sum speed the way they sum downtime, so those stay 4 columns.
  const showSpeed = label === "Day" || label === "Date";
  const rows = breakdownRows.map((r) => `<tr>
      <td>${escapeHtml(label === "Week" ? shortWeekLabel(r.date) : r.date)}</td>
      <td>${tierBadge(tierFor(r.uptimePct))}</td>
      <td class="num">${fmtPct(r.uptimePct)}</td>
      <td class="num">${fmtMin(r.totalDT)}</td>
      ${showSpeed ? `<td class="num">${fmtSpeed(r.towerDownMbps, r.towerUpMbps)}</td>
      <td class="num">${fmtSpeed(r.marilaoDownMbps, r.marilaoUpMbps)}</td>
      <td class="num">${fmtSpeed(r.kalayaanDownMbps, r.kalayaanUpMbps)}</td>` : ""}
    </tr>`).join("");
  return `<div style="overflow-x:auto; margin-top:8px;"><table>
      <thead><tr><th>${escapeHtml(label)}</th><th>Tier</th><th class="num">Uptime %</th><th class="num">Total DT</th>
      ${showSpeed ? `<th class="num">Converge Mbps</th><th class="num">PT&amp;T Mbps</th><th class="num">Kalayaan Mbps</th>` : ""}</tr></thead>
      <tbody>${rows}</tbody>
    </table></div>`;
}

function aggregateCustomRange(rows, start, end) {
  const filtered = rows.filter((r) => r.date >= start && r.date <= end)
    .sort((a, b) => a.date.localeCompare(b.date));
  const numericFields = ["internet", "ap", "switches", "cctv", "bio", "totalDT"];
  const sums = { internet: 0, ap: 0, switches: 0, cctv: 0, bio: 0, totalDT: 0 };
  let hasAny = false, uptimeSum = 0, uptimeCount = 0;
  const speedFields = ["towerDownMbps", "towerUpMbps", "marilaoDownMbps", "marilaoUpMbps", "kalayaanDownMbps", "kalayaanUpMbps"];
  const speedSums = { towerDownMbps: 0, towerUpMbps: 0, marilaoDownMbps: 0, marilaoUpMbps: 0, kalayaanDownMbps: 0, kalayaanUpMbps: 0 };
  const speedCounts = { towerDownMbps: 0, towerUpMbps: 0, marilaoDownMbps: 0, marilaoUpMbps: 0, kalayaanDownMbps: 0, kalayaanUpMbps: 0 };
  filtered.forEach((r) => {
    numericFields.forEach((f) => { if (r[f] !== null && r[f] !== undefined) { sums[f] += r[f]; hasAny = true; } });
    if (r.uptimePct !== null && r.uptimePct !== undefined) { uptimeSum += r.uptimePct; uptimeCount++; }
    speedFields.forEach((f) => { if (r[f] !== null && r[f] !== undefined) { speedSums[f] += r[f]; speedCounts[f]++; } });
  });
  const avgSpeed = {};
  speedFields.forEach((f) => { avgSpeed[f] = speedCounts[f] ? Math.round((speedSums[f] / speedCounts[f]) * 10) / 10 : null; });
  return {
    date: `${start} to ${end}`,
    internet: hasAny ? sums.internet : null, ap: hasAny ? sums.ap : null, switches: hasAny ? sums.switches : null,
    cctv: hasAny ? sums.cctv : null, bio: hasAny ? sums.bio : null, totalDT: hasAny ? sums.totalDT : null,
    uptimePct: uptimeCount ? uptimeSum / uptimeCount : null,
    ...avgSpeed, // average Converge/PT&T Mbps across the range -- used by the PDF export, not shown on-screen elsewhere
    dailyRows: filtered,
  };
}

function renderDailyRangePanel(rows, customRange) {
  const { start, end } = customRange || {};
  const group = (start && end) ? aggregateCustomRange(rows, start, end) : null;
  const hasData = group && group.dailyRows.length > 0;
  const rangeRemarks = (start && end) ? remarksInRange(lastRemarks, start, end) : [];
  const inputStyle = "background:var(--panel-2); border:1px solid var(--border); color:var(--text); border-radius:6px; padding:5px 8px; font-size:12px;";
  return `
    <div style="flex:1; min-width:260px; border-left:1px solid var(--border); padding-left:24px;">
      <div class="hero-label">Pick a date range</div>
      <div style="display:flex; gap:8px; align-items:center; margin-bottom:6px; flex-wrap:wrap;">
        <input type="date" id="range-start" value="${start ? escapeHtml(start) : ""}" style="${inputStyle}" />
        <span style="color:var(--text-mute); font-size:12px;">to</span>
        <input type="date" id="range-end" value="${end ? escapeHtml(end) : ""}" style="${inputStyle}" />
        <button type="button" id="range-apply" style="background:var(--brand); color:white; border:none; border-radius:6px; padding:5px 12px; font-size:12px; cursor:pointer;">Show</button>
      </div>
      ${group
        ? renderPeriodSummaryBlock(`Result: ${group.date}`, hasData ? group : null) + renderBreakdownTable("Date", group.dailyRows) +
          renderRemarksTable(rangeRemarks) + renderChecksTable(checkSummary(start, end)) +
          `<button type="button" id="export-pdf" ${hasData ? "" : "disabled"} style="margin-top:12px; background:${hasData ? "var(--brand)" : "var(--panel-2)"}; color:${hasData ? "white" : "var(--text-mute)"}; border:1px solid ${hasData ? "var(--brand)" : "var(--border)"}; border-radius:6px; padding:7px 14px; font-size:13px; cursor:${hasData ? "pointer" : "default"};">Export report (PDF)</button>`
        : `<div class="msg" style="padding:8px 0 0; text-align:left;">Pick a start and end date, then click Show.</div>`}
    </div>`;
}

// ---------------------------------------------------------------------------
// PDF export -- builds a formatted report (summary + daily table) for
// whatever date range is currently picked in the Daily filter, using jsPDF
// (loaded from CDN in <head>). Entirely client-side, no server involved.
// ---------------------------------------------------------------------------
function exportRangeReportPdf(group, remarks, checks) {
  if (!window.jspdf || !window.jspdf.jsPDF) {
    alert("PDF library didn't load (check your internet connection) -- try reloading the page.");
    return;
  }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: "pt", format: "a4" });
  const marginX = 40;
  let y = 50;

  doc.setFontSize(16);
  doc.setFont(undefined, "bold");
  doc.text("BK Network Monitoring — Report", marginX, y);
  y += 22;

  doc.setFontSize(11);
  doc.setFont(undefined, "normal");
  doc.text(`Date range: ${group.date}`, marginX, y);
  y += 14;
  doc.text(`Generated: ${new Date().toLocaleString()}`, marginX, y);
  y += 24;

  const tier = tierFor(group.uptimePct);
  doc.setFontSize(13);
  doc.setFont(undefined, "bold");
  doc.text("Summary", marginX, y);
  y += 18;
  doc.setFontSize(11);
  doc.setFont(undefined, "normal");
  const summaryLines = [
    `Overall uptime: ${fmtPct(group.uptimePct)}  (Tier: ${tier ? tier.name : "No data"})`,
    `Total downtime -- Internet ${fmtMin(group.internet)}, Access Points ${fmtMin(group.ap)}, Switches ${fmtMin(group.switches)}`,
    `CCTV ${fmtMin(group.cctv)}, Biometrics ${fmtMin(group.bio)}, Total DT ${fmtMin(group.totalDT)}`,
    `Average ISP throughput -- Converge (Tower) ${fmtSpeed(group.towerDownMbps, group.towerUpMbps)} down/up`,
    `PT&T (Marilao) ${fmtSpeed(group.marilaoDownMbps, group.marilaoUpMbps)} down/up`,
    `Converge (Kalayaan) ${fmtSpeed(group.kalayaanDownMbps, group.kalayaanUpMbps)} down/up`,
  ];
  summaryLines.forEach((line) => { doc.text(line, marginX, y); y += 16; });
  y += 10;

  doc.setFontSize(13);
  doc.setFont(undefined, "bold");
  doc.text("Daily breakdown", marginX, y);
  y += 10;

  const body = group.dailyRows.map((r) => [
    r.date, tierFor(r.uptimePct) ? tierFor(r.uptimePct).name : "—", fmtPct(r.uptimePct),
    fmtMin(r.internet), fmtMin(r.ap), fmtMin(r.switches), fmtMin(r.cctv), fmtMin(r.bio), fmtMin(r.totalDT),
    fmtSpeed(r.towerDownMbps, r.towerUpMbps), fmtSpeed(r.marilaoDownMbps, r.marilaoUpMbps),
    fmtSpeed(r.kalayaanDownMbps, r.kalayaanUpMbps),
  ]);

  doc.autoTable({
    startY: y + 8,
    margin: { left: marginX, right: marginX },
    styles: { fontSize: 8, cellPadding: 4 },
    headStyles: { fillColor: [37, 99, 235] },
    head: [["Date", "Tier", "Uptime %", "Internet", "AP", "Switches", "CCTV", "Bio", "Total DT", "Converge Mbps", "PT&T Mbps", "Kalayaan Mbps"]],
    body,
  });

  let afterTableY = (doc.lastAutoTable && doc.lastAutoTable.finalY) ? doc.lastAutoTable.finalY + 24 : y + 24;
  doc.setFontSize(13);
  doc.setFont(undefined, "bold");
  doc.text("Remarks", marginX, afterTableY);
  afterTableY += 10;

  if (remarks && remarks.length) {
    doc.autoTable({
      startY: afterTableY,
      margin: { left: marginX, right: marginX },
      styles: { fontSize: 8, cellPadding: 4 },
      headStyles: { fillColor: [37, 99, 235] },
      head: [["Date", "DT Start", "DT End", "Reason"]],
      body: remarks.map((r) => [r.date, r.dtStart || "—", r.dtEnd || "—", r.reason || "—"]),
    });
  } else {
    doc.setFontSize(10);
    doc.setFont(undefined, "normal");
    doc.text("No remarks logged for this range.", marginX, afterTableY + 10);
  }

  // Daily check-in section: every business day in the range, with who checked.
  let checksY = (doc.lastAutoTable && doc.lastAutoTable.finalY) ? doc.lastAutoTable.finalY + 24 : afterTableY + 40;
  if (checksY > 740) { doc.addPage(); checksY = 50; }
  doc.setFontSize(13);
  doc.setFont(undefined, "bold");
  doc.text("Daily checks", marginX, checksY);
  checksY += 8;
  if (checks && checks.rows.length) {
    doc.setFontSize(10);
    doc.setFont(undefined, "normal");
    doc.text(`${checks.complete} of ${checks.total} business days fully checked` + (checks.partial ? `, ${checks.partial} partial` : "") + (checks.missed ? `, ${checks.missed} missed` : ""), marginX, checksY + 10);
    doc.text(checksOwnerText(checks), marginX, checksY + 23);
    doc.autoTable({
      startY: checksY + 32,
      margin: { left: marginX, right: marginX },
      styles: { fontSize: 8, cellPadding: 4 },
      headStyles: { fillColor: [37, 99, 235] },
      head: [["Date", "Overall", ...CHECK_ASSIGNMENTS.map((a) => `${a.area} (${a.owner})`), "Notes"]],
      body: checks.rows.map((r) => [r.date, r.status, ...r.areas.map((a) => a.status === "Checked" ? "Checked" + (a.time ? " " + a.time : "") : a.status), r.notes || "-"]),
    });
  } else {
    doc.setFontSize(10);
    doc.setFont(undefined, "normal");
    doc.text("No business days to check in this range.", marginX, checksY + 12);
  }

  const fileStart = group.date.split(" to ")[0] || "range";
  const fileEnd = group.date.split(" to ")[1] || "";
  doc.save(`BK-Network-Report_${fileStart}_to_${fileEnd}.pdf`);
}

function renderCurrentPeriodPanel(rows, liveStatus) {
  const cur = getCurrentQuarterWeek();
  const avgs = computeQuarterWeeklyAverages(rows);
  const withUptime = rows.filter((r) => r.uptimePct !== null);
  const latest = withUptime[withUptime.length - 1];
  const lastPoll = liveStatus && liveStatus.lastPollTs;   // poll_devices.py (Access Points/Switches)
  const lastPing = liveStatus && liveStatus.lastPingTs;   // ping_devices.py (CCTV/Biometrics)
  return `
    <div style="flex:1; min-width:260px; border-left:1px solid var(--border); padding-left:24px;">
      <div class="hero-label">Current period</div>
      <div style="font-size:19px; font-weight:700; margin-bottom:10px;">Q${cur.quarter} ${cur.year} &middot; Week ${cur.week}</div>
      <div class="hero-label" style="margin-bottom:6px;">Average weekly result
        <span style="font-weight:400;">(${avgs.weeksCounted} week${avgs.weeksCounted === 1 ? "" : "s"} so far)</span>
      </div>
      <div style="font-size:13px; color:var(--text-dim); line-height:1.9;">
        Internet <strong style="color:var(--text);">${fmtMin(avgs.internet)}</strong>/wk &middot;
        Access Points <strong style="color:var(--text);">${fmtMin(avgs.ap)}</strong>/wk &middot;
        Switches <strong style="color:var(--text);">${fmtMin(avgs.switches)}</strong>/wk<br/>
        CCTV <strong style="color:var(--text);">${fmtMin(avgs.cctv)}</strong>/wk &middot;
        Biometrics <strong style="color:var(--text);">${fmtMin(avgs.bio)}</strong>/wk

        Last poll (Access Points/Switches): <strong style="color:var(--text-dim);">${fmtDateTime(lastPoll)}</strong><br/>
        Last ping (CCTV/Biometrics): <strong style="color:var(--text-dim);">${fmtDateTime(lastPing)}</strong>
      </div>

}

// The middle column -- driven by the "Report period" filter buttons.
// Weekly/Monthly/Quarterly/Yearly show the CURRENT such period's result
// plus a breakdown of its next-finer sub-periods (quarter -> months,
// month -> weeks, week -> days). Daily is different: instead of one day,
// it's a calendar range picker that aggregates whatever range you pick.
function renderPeriodResultPanel(rows, granularity, customRange) {
  if (granularity === "daily") return renderDailyRangePanel(rows, customRange);

  const group = getCurrentPeriodGroup(rows, granularity);
  const titles = { weekly: "This week", monthly: "This month", quarterly: "This quarter", yearly: "This year" };
  const breakdownLabels = { weekly: "Day", monthly: "Week", quarterly: "Month", yearly: "Quarter" };

  let breakdown = [];
  if (group && group.dailyRows) {
    if (granularity === "weekly") breakdown = group.dailyRows;
    else if (granularity === "monthly") breakdown = aggregateRows(group.dailyRows, "weekly");
    else if (granularity === "quarterly") breakdown = aggregateRows(group.dailyRows, "monthly");
    else if (granularity === "yearly") breakdown = aggregateRows(group.dailyRows, "quarterly");
  }

  const title = titles[granularity] + (group ? ` (${group.date})` : "");
  const { start: periodStart, end: periodEnd } = dateRangeOfRows(group && group.dailyRows);
  const periodRemarks = remarksInRange(lastRemarks, periodStart, periodEnd);
  const periodChecks = checkSummary(periodStart, periodEnd);
  return `
    <div style="flex:1; min-width:260px; border-left:1px solid var(--border); padding-left:24px;">
      ${renderPeriodSummaryBlock(title, group)}
      ${renderBreakdownTable(breakdownLabels[granularity], breakdown)}
      ${renderRemarksTable(periodRemarks)}
      ${renderChecksSummaryLine(periodChecks)}
    </div>`;
}

// Shown first, above everything else -- the three-column card you glance
// at to know "are we OK right now" (left), "how's the period I picked
// doing" (middle), and "where does this quarter/week stand" (right).
function renderHero(rows, liveStatus, granularity, customRange) {
  const withUptime = rows.filter((r) => r.uptimePct !== null);
  const latest = withUptime[withUptime.length - 1];
  const tier = latest ? tierFor(latest.uptimePct) : null;
  const color = tier ? tier.color : "#6b7280";

  const leftCol = latest ? `
    <div style="flex:1; min-width:220px;">
      <div class="hero-label">Latest day result &middot; ${latest.date}</div>
      <div class="hero-value">
        <span class="hero-pct">${fmtPct(latest.uptimePct)}</span>
        ${tierBadge(tier)}
      </div>
      <div class="hero-sub">
        Internet ${fmtMin(latest.internet)} &middot; Access Points ${fmtMin(latest.ap)} &middot;
        Switches ${fmtMin(latest.switches)} &middot; CCTV ${fmtMin(latest.cctv)} &middot;
        Biometrics ${fmtMin(latest.bio)} &middot; Total DT ${fmtMin(latest.totalDT)}<br/>
        Converge (Tower) ${fmtSpeed(latest.towerDownMbps, latest.towerUpMbps)} down/up
        (avg ${fmtSpeedAvg(latest.towerDownMbps, latest.towerUpMbps)}) &middot;
        PT&amp;T (Marilao) ${fmtSpeed(latest.marilaoDownMbps, latest.marilaoUpMbps)} down/up
        (avg ${fmtSpeedAvg(latest.marilaoDownMbps, latest.marilaoUpMbps)}) &middot;
        Converge (Kalayaan) ${fmtSpeed(latest.kalayaanDownMbps, latest.kalayaanUpMbps)} down/up
        (avg ${fmtSpeedAvg(latest.kalayaanDownMbps, latest.kalayaanUpMbps)})
      </div>
    </div>` : `<div style="flex:1; min-width:200px;"><div class="msg" style="padding:0; text-align:left;">No daily result available yet.</div></div>`;

  return `<section>
    <div class="hero" style="border-left-color:${color}; display:flex; gap:24px; flex-wrap:wrap; justify-content:space-between;">
      ${leftCol}
      ${renderPeriodResultPanel(rows, granularity, customRange)}
      ${renderCurrentPeriodPanel(rows, liveStatus)}
    </div>
  </section>`;
}

function renderSummary(rows) {
  const withUptime = rows.filter((r) => r.uptimePct !== null);
  const latest = withUptime[withUptime.length - 1];
  const last30 = withUptime.slice(-30);
  const avg30 = last30.length ? last30.reduce((s, r) => s + r.uptimePct, 0) / last30.length : null;
  const worst30 = last30.length ? last30.reduce((min, r) => r.uptimePct < min.uptimePct ? r : min, last30[0]) : null;

  return `<section><h2>Summary</h2><div class="grid">
    <div class="card">
      <div class="label">Latest day (${latest ? latest.date : "—"})</div>
      <div class="value">${latest ? fmtPct(latest.uptimePct) : "—"}</div>
      <div class="sub-value">${tierBadge(latest ? tierFor(latest.uptimePct) : null)}</div>
    </div>
    <div class="card">
      <div class="label">30-day average uptime</div>
      <div class="value">${avg30 !== null ? fmtPct(avg30) : "—"}</div>
      <div class="sub-value">${tierBadge(avg30 !== null ? tierFor(avg30) : null)}</div>
    </div>
    <div class="card">
      <div class="label">Worst day (last 30)</div>
      <div class="value">${worst30 ? fmtPct(worst30.uptimePct) : "—"}</div>
      <div class="sub-value">${worst30 ? worst30.date : "—"}</div>
    </div>
    <div class="card">
      <div class="label">Days tracked</div>
      <div class="value">${withUptime.length}</div>
      <div class="sub-value">with a computed uptime %</div>
    </div>
  </div>
  <div class="legend">
    ${TIERS.map(t => `<span><span class="dot" style="background:${t.color}"></span>${t.name} ≥ ${t.min}%</span>`).join("")}
  </div>
  </section>`;
}

// ---------------------------------------------------------------------------
// Main load + render
// ---------------------------------------------------------------------------
let lastRows = null;        // daily rows from the most recent successful load
let lastLiveStatus = null;
let lastRemarks = [];       // manually-typed downtime reasons from the "Remarks" tab
let lastRawRows = [];       // raw RawStatusLog rows, kept so live status can be recomputed after a device change
let lastDevices = [];       // rows from the "Devices" tab (manual additions + remove/restore overrides)
let manageOpen = false;     // Manage devices section expanded?
let editingDevice = null;   // CCTV/Biometrics device currently being edited in the Manage devices form
let lastCheckins = [];      // daily dashboard check-ins from the "Checkins" tab
let lastCheckers = [];      // people who can check in, from the "Checkers" tab
let checkersOpen = false;   // Manage people expanded?
let adminKey = "";          // admin passphrase, kept in memory only (never saved)
let currentGranularity = "weekly"; // which Report period filter button is active
let customDateRange = { start: null, end: null }; // Daily filter's calendar range picker

const openFolds = new Set();   // which collapsible sections are expanded (all start collapsed)
function fold(id, title, html) {
  const open = openFolds.has(id);
  const inner = html.replace(/<h2>[\s\S]*?<\/h2>/, "");   // the fold bar replaces the section's own heading
  return `<section class="fold">
    <button type="button" class="fold-head" data-fold="${id}">
      <span>${title}</span><span class="fold-hint">${open ? "Click to hide ▾" : "Click to show ▸"}</span>
    </button>
    ${open ? `<div class="fold-body">${inner}</div>` : ""}
  </section>`;
}

function renderApp() {
  if (!lastRows) return;
  const app = $("app");
  const withUptime = lastRows.filter((r) => r.uptimePct !== null);
  const latestRow = withUptime[withUptime.length - 1] || null;
  // Top-left: daily check-in. Top-right: report period buttons + latest day
  // result / date picker / current period (the hero card). Everything else below.
  $("highlight").innerHTML = renderLiveNetwork(lastLiveStatus || {}, latestRow);
  $("top-left").innerHTML = renderCheckinSection();
  $("top-hero").innerHTML = renderHero(lastRows, lastLiveStatus, currentGranularity, customDateRange); // latest day / selected period result / current quarter-week, all in one card
  app.innerHTML =
    renderManageDevices() +
    fold("remark", "Log a downtime remark", renderRemarkForm()) +
    fold("summary", "Summary", renderSummary(lastRows)); // summary always reflects daily data — "latest day" only makes sense at daily grain
}

async function loadDashboard() {
  const url = $("cfg-url").value.trim();
  const secret = $("cfg-secret").value.trim();
  const tab = $("cfg-tab").value.trim() || "Sheet1";
  const errorSlot = $("error-slot");
  const app = $("app");
  const statusLine = $("status-line");
  const filterBar = $("filter-bar");
  errorSlot.innerHTML = "";

  if (!url || !secret) {
    errorSlot.innerHTML = `<div class="error-box">Enter both the Apps Script URL and secret first.</div>`;
    showConfig(true);
    return;
  }

  saveConfig({ url, secret, tab });
  statusLine.textContent = "Loading…";
  app.innerHTML = `<div class="msg">Loading…</div>`;
  $("highlight").innerHTML = ""; $("top-left").innerHTML = ""; $("top-hero").innerHTML = "";
  filterBar.style.display = "none";

  try {
    const [scoreboardData, rawLogData, remarksData, devicesData, checkinsData, checkersData] = await Promise.all([
      callAppsScript(url, secret, "getSheetData", { tab }),
      callAppsScript(url, secret, "getRawLog"),
      // Remarks / Devices tabs are optional -- if they don't exist yet, don't fail the whole load.
      callAppsScript(url, secret, "getSheetData", { tab: "Remarks" }).catch(() => ({ values: [] })),
      callAppsScript(url, secret, "getSheetData", { tab: "Devices" }).catch(() => ({ values: [] })),
      callAppsScript(url, secret, "getSheetData", { tab: "Checkins" }).catch(() => ({ values: [] })),
      callAppsScript(url, secret, "getSheetData", { tab: "Checkers" }).catch(() => ({ values: [] })),
    ]);

    lastRows = parseScoreboard(scoreboardData.values || []);
    lastRawRows = rawLogData.rows || [];
    lastDevices = parseDevices(devicesData.values || []);
    lastLiveStatus = parseLiveStatus(lastRawRows, ignoredKeysFrom(lastDevices));
    lastRemarks = parseRemarks(remarksData.values || []);
    lastCheckins = parseCheckins(checkinsData.values || []);
    lastCheckers = parseCheckers(checkersData.values || []);
    // Default people (aliases) until the Checkers tab has its own list:
    // Jeff = Jeffrey Jordan, Pao = Pao Dimayuga, Allen = BK.IT account.
    if (!lastCheckers.length) lastCheckers = ["Jeff", "Pao", "Allen"].map((name) => ({ name, active: true }));
    expandedCategory = null;
    customDateRange = { start: null, end: null };

    filterBar.style.display = "flex";
    renderApp();

    statusLine.textContent = `Loaded ${lastRows.length} days · ${new Date().toLocaleTimeString()}`;
    showConfig(false);
  } catch (err) {
    app.innerHTML = "";
    $("highlight").innerHTML = ""; $("top-left").innerHTML = ""; $("top-hero").innerHTML = "";
    filterBar.style.display = "none";
    errorSlot.innerHTML = `<div class="error-box">${err.message}</div>`;
    statusLine.textContent = "Failed to load";
    showConfig(true);
  }
}

$("cfg-load").addEventListener("click", loadDashboard);

$("filter-bar").addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-granularity]");
  if (!btn) return;
  currentGranularity = btn.dataset.granularity;
  $("filter-bar").querySelectorAll("button").forEach((b) => b.classList.toggle("active", b === btn));
  renderApp();
});

// #app itself is never replaced (only its innerHTML), so a listener attached
// here survives every re-render -- toggles the clicked live-status card's
// device-detail panel open/closed, and applies the Daily filter's picked
// calendar range when "Show" is clicked.
const onAppClick = (e) => {
  const catBtn = e.target.closest("button[data-toggle-category]");
  if (catBtn) {
    const cat = catBtn.dataset.toggleCategory;
    expandedCategory = expandedCategory === cat ? null : cat;
    renderApp();
    return;
  }

  const rangeApply = e.target.closest("#range-apply");
  if (rangeApply) {
    const start = $("range-start") ? $("range-start").value : "";
    const end = $("range-end") ? $("range-end").value : "";
    if (start && end) {
      customDateRange = { start, end };
      renderApp();
    }
    return;
  }

  const exportBtn = e.target.closest("#export-pdf");
  if (exportBtn && !exportBtn.disabled && lastRows && customDateRange.start && customDateRange.end) {
    const group = aggregateCustomRange(lastRows, customDateRange.start, customDateRange.end);
    const remarks = remarksInRange(lastRemarks, customDateRange.start, customDateRange.end);
    exportRangeReportPdf(group, remarks, checkSummary(customDateRange.start, customDateRange.end));
    return;
  }

  if (e.target.closest("#manage-toggle")) {
    manageOpen = !manageOpen;
    renderApp();
    return;
  }

  const devBtn = e.target.closest("[data-dev-action]");
  if (devBtn) {
    const d = {
      type: devBtn.dataset.devType, name: devBtn.dataset.devName, mac: devBtn.dataset.devMac,
      ip: devBtn.dataset.devIp, host: devBtn.dataset.devHost,
    };
    const action = devBtn.dataset.devAction;
    if (action === "edit") {
      editingDevice = d;
      renderApp();
      return;
    }
    const verb = action === "remove" ? "Remove" : "Restore";
    if (action === "remove" && !confirm(`Remove "${d.name}" from monitoring? It stops counting in live status and downtime (you can restore it later).`)) return;
    devBtn.disabled = true;
    const existing = lastDevices.find((x) => deviceKey(x.type, x.name, x.mac) === deviceKey(d.type, d.name, d.mac));
    saveDeviceRemote({ ...d, monitored: action === "restore", source: existing ? existing.source : "Override" })
      .then(() => { renderApp(); })
      .catch((err) => { devBtn.disabled = false; alert(`${verb} failed: ${err.message}`); });
    return;
  }

  if (e.target.closest("#dev-cancel")) {
    editingDevice = null;
    renderApp();
    return;
  }

  const devSave = e.target.closest("#dev-save");
  if (devSave) {
    const name = $("dev-name").value.trim();
    const type = $("dev-type").value;
    const ip = $("dev-ip").value.trim();
    const statusEl = $("dev-status");
    const fail = (msg) => { statusEl.textContent = msg; statusEl.style.color = "var(--red)"; };
    if (!name || !ip) return fail("Name and IP address are required.");
    if (!/^\d{1,3}(\.\d{1,3}){3}$/.test(ip)) return fail("IP address doesn't look valid (e.g. 192.168.0.50).");
    const orig = editingDevice;
    const dup = lastDevices.concat(Object.values((lastLiveStatus && lastLiveStatus.devices) || {}).flat())
      .some((x) => PING_TYPES.has(x.type) && x.monitored !== false && x.name.toLowerCase() === name.toLowerCase()
        && !(orig && orig.name.toLowerCase() === name.toLowerCase()));
    if (dup) return fail("A CCTV/Biometrics device with that name already exists.");
    devSave.disabled = true;
    statusEl.textContent = "Saving…"; statusEl.style.color = "var(--text-mute)";
    (async () => {
      // Renamed: retire the old name so it stops being pinged, then save the new one.
      if (orig && orig.name.toLowerCase() !== name.toLowerCase()) {
        await saveDeviceRemote({ ...orig, monitored: false, source: "Override" });
      }
      await saveDeviceRemote({ name, type, ip, host: "BK Tower Shadow", mac: "", monitored: true, source: "Manual" });
    })().then(() => { editingDevice = null; renderApp(); })
      .catch((err) => { devSave.disabled = false; fail(`Failed: ${err.message}`); });
    return;
  }

  const foldBtn = e.target.closest("[data-fold]");
  if (foldBtn) {
    const id = foldBtn.dataset.fold;
    if (openFolds.has(id)) openFolds.delete(id); else openFolds.add(id);
    renderApp();
    return;
  }

  if (e.target.closest("#checkers-toggle")) {
    if (!checkersOpen && !adminKey) {
      const k = prompt("Admin passphrase to manage people:");
      if (!k) return;
      adminKey = k.trim();
    }
    checkersOpen = !checkersOpen;
    if (!checkersOpen) adminKey = "";
    renderApp();
    return;
  }

  const checkerBtn = e.target.closest("[data-checker-action]");
  if (checkerBtn) {
    const name = checkerBtn.dataset.checkerName;
    const makeActive = checkerBtn.dataset.checkerAction === "activate";
    checkerBtn.disabled = true;
    callAppsScript($("cfg-url").value.trim(), $("cfg-secret").value.trim(), "saveChecker", { name, active: makeActive ? "Yes" : "No", adminKey })
      .then(() => {
        const c = lastCheckers.find((x) => x.name.toLowerCase() === name.toLowerCase());
        if (c) c.active = makeActive;
        renderApp();
      })
      .catch((err) => { checkerBtn.disabled = false; alert(`Failed: ${err.message}`); });
    return;
  }

  if (e.target.closest("#checker-add")) {
    const input = $("checker-name");
    const name = input ? input.value.trim() : "";
    if (!name) return;
    if (lastCheckers.some((x) => x.name.toLowerCase() === name.toLowerCase())) { alert("That person is already in the list."); return; }
    callAppsScript($("cfg-url").value.trim(), $("cfg-secret").value.trim(), "saveChecker", { name, active: "Yes", adminKey })
      .then(() => { lastCheckers.push({ name, active: true }); renderApp(); })
      .catch((err) => alert(`Failed: ${err.message}`));
    return;
  }

  const checkinBtn = e.target.closest("#checkin-submit");
  if (checkinBtn) {
    const name = $("checkin-name") ? $("checkin-name").value : "";
    const notes = $("checkin-notes") ? $("checkin-notes").value.trim() : "";
    const statusEl = $("checkin-status");
    if (!name) return;
    const now = new Date();
    const date = localDateStr(now), time = localTimeStr(now);
    checkinBtn.disabled = true;
    if (statusEl) { statusEl.textContent = "Saving…"; statusEl.style.color = "var(--text-mute)"; }
    callAppsScript($("cfg-url").value.trim(), $("cfg-secret").value.trim(), "appendCheckin", { date, time, name, notes })
      .then(() => {
        lastCheckins.push({ date, time, name, notes });
        lastCheckins.sort((a, b) => a.date.localeCompare(b.date) || a.time.localeCompare(b.time));
        renderApp();
      })
      .catch((err) => {
        checkinBtn.disabled = false;
        if (statusEl) { statusEl.textContent = `Failed: ${err.message}`; statusEl.style.color = "var(--red)"; }
      });
    return;
  }

  const remarkSubmit = e.target.closest("#remark-submit");
  if (remarkSubmit) {
    const date = $("remark-date") ? $("remark-date").value : "";
    const dtStart = $("remark-start") ? $("remark-start").value : "";
    const dtEnd = $("remark-end") ? $("remark-end").value : "";
    const reason = $("remark-reason") ? $("remark-reason").value.trim() : "";
    const statusEl = $("remark-status");
    if (!date || !reason) {
      if (statusEl) { statusEl.textContent = "Date and reason are required."; statusEl.style.color = "var(--red)"; }
      return;
    }
    const url = $("cfg-url").value.trim();
    const secret = $("cfg-secret").value.trim();
    remarkSubmit.disabled = true;
    if (statusEl) { statusEl.textContent = "Saving…"; statusEl.style.color = "var(--text-mute)"; }
    callAppsScript(url, secret, "appendRemark", { date, dtStart, dtEnd, reason })
      .then(() => {
        lastRemarks.push({ date, dtStart, dtEnd, reason });
        lastRemarks.sort((a, b) => a.date.localeCompare(b.date) || a.dtStart.localeCompare(b.dtStart));
        renderApp();
        const newStatusEl = $("remark-status");
        if (newStatusEl) { newStatusEl.textContent = "Saved."; newStatusEl.style.color = "var(--sg)"; }
      })
      .catch((err) => {
        remarkSubmit.disabled = false;
        const errStatusEl = $("remark-status");
        if (errStatusEl) { errStatusEl.textContent = `Failed: ${err.message}`; errStatusEl.style.color = "var(--red)"; }
      });
    return;
  }
};
// Hovering a topology ring shows the devices behind it in a see-through box.
let topoNodeInfo = {};
let topoTipTimer = null;
function topoTipHtml(info) {
  if (info.isp) {
    const t = info.isp;
    if (t.down === undefined) return `<div class="tip-head"><strong>${escapeHtml(info.label)}</strong></div><div class="tip-empty">No traffic data captured yet.</div>`;
    return `<div class="tip-head"><strong>${escapeHtml(info.label)}</strong><span>${escapeHtml(t.date || "")}</span></div>
      <div class="tip-isp">
        <div><span>Download</span><strong>${t.down}</strong><em>Mbps</em></div>
        <div><span>Upload</span><strong>${t.up}</strong><em>Mbps</em></div>
      </div>
      <div class="tip-empty">UniFi's average traffic during business hours that day &mdash; how busy the line was, not a speed test.</div>`;
  }
  const { online, total } = info.stats;
  const rows = info.devices.map((d) => `<li class="${d.status === "online" ? "" : "down"}">
      <span class="tip-dot"></span><span class="tip-name">${escapeHtml(d.name)}</span>
      <span class="tip-meta">${escapeHtml(d.ip || d.cat)}</span>
      <span class="tip-status">${escapeHtml(d.status)}</span></li>`).join("");
  return `<div class="tip-head"><strong>${escapeHtml(info.label)}</strong><span>${total ? `${online}/${total} online` : "no data yet"}</span></div>
    ${total ? `<ul>${rows}</ul>` : `<div class="tip-empty">No devices logged for this group yet.</div>`}`;
}
function showTopoTip(nodeEl) {
  const tip = $("topo-tip");
  const info = tip && topoNodeInfo[nodeEl.dataset.topoNode];
  if (!info) return;
  clearTimeout(topoTipTimer);
  tip.innerHTML = topoTipHtml(info);
  tip.hidden = false;
  const graph = tip.parentElement.getBoundingClientRect();
  const r = nodeEl.getBoundingClientRect();
  const w = tip.offsetWidth, h = tip.offsetHeight;
  let left = r.right - graph.left + 10;
  if (left + w > graph.width - 6) left = r.left - graph.left - w - 10;   // flip to the left side
  let top = r.top - graph.top + r.height / 2 - h / 2;
  top = Math.max(6, Math.min(top, graph.height - h - 6));
  tip.style.left = `${Math.max(6, left)}px`;
  tip.style.top = `${top}px`;
}
function hideTopoTip(delay = 120) {
  clearTimeout(topoTipTimer);
  topoTipTimer = setTimeout(() => { const tip = $("topo-tip"); if (tip) tip.hidden = true; }, delay);
}
const highlightEl = $("highlight");
highlightEl.addEventListener("mouseover", (e) => {
  const node = e.target.closest("[data-topo-node]");
  if (node) return showTopoTip(node);
  if (e.target.closest("#topo-tip")) clearTimeout(topoTipTimer);
});
highlightEl.addEventListener("mouseout", (e) => {
  if (e.target.closest("[data-topo-node]") || e.target.closest("#topo-tip")) hideTopoTip();
});
highlightEl.addEventListener("focusin", (e) => { const node = e.target.closest("[data-topo-node]"); if (node) showTopoTip(node); });
highlightEl.addEventListener("focusout", (e) => { if (e.target.closest("[data-topo-node]")) hideTopoTip(0); });

["app", "highlight", "top-left", "top-hero"].forEach((id) => $(id).addEventListener("click", onAppClick));

// auto-load if we already have saved config
if ($("cfg-url").value && $("cfg-secret").value) {
  loadDashboard();
}
</script>
</body>
</html>
