     window.jspdf global is ready by the time someone clicks Export. -->

<style>
  /* BKIT light theme -- white + the logo's green colorway
     (deep forest #0a5c2e -> brand #0b7a3e -> leaf #1f9d4d -> lime #7cc243). */
  :root {
    --bg: #f2f7f3; --panel: #ffffff; --panel-2: #f4f9f5; --border: #dfe9e2;
    --text: #12291b; --text-dim: #46604f; --text-mute: #7b8f82;
    --brand-dark: #0a5c2e; --brand: #0b7a3e; --brand-2: #1f9d4d; --lime: #7cc243;
    --emerald: #047857; --sg: #16a34a; --green: #65a30d; --yellow: #c27c0e; --red: #dc2626;
    --shadow: 0 1px 2px rgba(10,60,30,0.05), 0 4px 14px rgba(10,60,30,0.06);
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5; -webkit-font-smoothing: antialiased;
  }
  .page { padding: 22px 24px 32px; max-width: 1600px; margin: 0 auto; }

  /* Top bar */
  .topbar {
    position: sticky; top: 0; z-index: 20; background: #fff;
    display: flex; align-items: center; gap: 18px; padding: 10px 24px;
    box-shadow: 0 1px 0 var(--border), 0 6px 18px rgba(10,60,30,0.06);
  }
  .topbar::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: -3px; height: 3px;
    background: linear-gradient(90deg, var(--brand-dark), var(--brand-2) 55%, var(--lime));
  }
  .topbar img { height: 46px; width: auto; display: block; }
  .topbar .titles { border-left: 1px solid var(--border); padding-left: 18px; }
  h1 { font-size: 18px; font-weight: 700; margin: 0; color: var(--brand-dark); letter-spacing: -0.01em; }
  .sub { color: var(--text-dim); font-size: 12.5px; margin: 0; }
  .topbar-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
  .cfg-link { display: inline-flex; align-items: center; gap: 6px; background: none; border: 1px solid transparent; color: var(--text-mute);
    font-size: 12.5px; font-weight: 600; padding: 5px 10px; border-radius: 8px; cursor: pointer; }
  .cfg-link:hover, .cfg-link[aria-expanded="true"] { color: var(--brand); background: var(--panel-2); border-color: var(--border); }
  .config-bar[hidden] { display: none; }

  .config-bar {
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 10px 12px; margin-bottom: 20px; font-size: 13px;
  }
  .config-bar input {
    background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
    border-radius: 8px; padding: 7px 10px; font-size: 13px; flex: 1; min-width: 160px;
  }
  input, select { font-family: inherit; }
  input:focus, select:focus { outline: 2px solid rgba(31,157,77,0.35); outline-offset: 0; border-color: var(--brand-2) !important; }
  button { font-family: inherit; }
  .config-bar button {
    background: var(--brand); color: white; border: none; border-radius: 8px;
    padding: 8px 16px; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .config-bar button:hover { background: var(--brand-dark); }
  .status-line { font-size: 12px; color: var(--text-mute); }

  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; margin-bottom: 4px; }
  .card {
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 12px; padding: 16px;
    position: relative; overflow: hidden;
  }
  .card::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
    background: linear-gradient(180deg, var(--brand-2), var(--lime));
  }
  .card .label { font-size: 12px; color: var(--text-dim); margin-bottom: 6px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
  .card .value { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; }
  .card .sub-value { font-size: 12px; color: var(--text-mute); margin-top: 4px; }

  .badge {
    display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px;
    border-radius: 999px; font-size: 12px; font-weight: 600;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .tier-emerald { background: rgba(4,120,87,0.10); color: var(--emerald); }
  .tier-sg { background: rgba(22,163,74,0.10); color: var(--sg); }
  .tier-green { background: rgba(101,163,13,0.12); color: var(--green); }
  .tier-yellow { background: rgba(234,179,8,0.14); color: var(--yellow); }
  .tier-red { background: rgba(220,38,38,0.10); color: var(--red); }
  .tier-na { background: rgba(123,143,130,0.12); color: var(--text-mute); }

  /* Every section is a white widget card, like the reference layout. */
  section {
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 18px 20px; margin-bottom: 20px;
  }
  section h2 {
    font-size: 15px; font-weight: 700; margin: 0 0 14px; padding-bottom: 10px; color: var(--brand-dark);
    position: relative; display: flex; align-items: center;
  }
  section h2::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2px; border-radius: 2px;
    background: linear-gradient(90deg, var(--brand-2), var(--lime) 40%, rgba(124,194,67,0) 85%);
  }
  section.fold { background: none; border: none; box-shadow: none; padding: 0; margin-bottom: 12px; }
  section.fold > .fold-body > section { margin-bottom: 0; }
  .fold-head { width: 100%; display: flex; justify-content: space-between; align-items: center; background: var(--panel); border: 1px solid var(--border); box-shadow: var(--shadow); color: var(--brand-dark); border-radius: 12px; padding: 13px 16px; font-size: 14px; font-weight: 700; cursor: pointer; text-align: left; }
  .fold-head:hover { background: var(--panel-2); border-color: #c6dccd; }
  .fold-head .fold-hint { font-size: 12px; font-weight: 500; color: var(--text-mute); }
  .fold-body { padding: 12px 0 4px; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { color: var(--text-dim); font-weight: 600; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.04em; background: var(--panel-2); }
  tbody tr:hover td { background: #eef6f0; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .weekend-row td { color: var(--text-mute); }

  .chart-wrap { background: var(--panel-2); border: 1px solid var(--border); border-radius: 12px; padding: 16px; overflow-x: auto; }

  .msg { color: var(--text-mute); font-size: 13px; padding: 20px; text-align: center; }
  .error-box {
    background: #fef2f2; border: 1px solid #fecaca;
    color: #991b1b; border-radius: 10px; padding: 12px 14px; font-size: 13px; margin-bottom: 20px;
    white-space: pre-wrap;
  }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--text-dim); margin-top: 10px; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }

  .top-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.5fr); gap: 20px; align-items: start; }
  .top-grid > div > section { margin-bottom: 20px; }
  @media (max-width: 1000px) { .top-grid { grid-template-columns: minmax(0, 1fr); } }
  .filter-bar {
    display: none; gap: 6px; align-items: center; margin-bottom: 14px; flex-wrap: wrap;
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); padding: 8px 10px;
  }
  .filter-bar .filter-label { font-size: 12px; color: var(--text-dim); margin-right: 4px; font-weight: 600; }
  .filter-bar button {
    background: transparent; border: 1px solid transparent; color: var(--text-dim);
    border-radius: 8px; padding: 6px 14px; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .filter-bar button:hover { color: var(--brand); background: var(--panel-2); }
  .filter-bar button.active { background: var(--brand); border-color: var(--brand); color: white; }

  .live-card { cursor: pointer; text-align: left; font: inherit; color: inherit; width: 100%; transition: border-color .15s, box-shadow .15s, transform .15s; }
  .live-card:hover { border-color: var(--brand-2); box-shadow: 0 6px 16px rgba(10,92,46,0.10); transform: translateY(-1px); }
  .live-card.expanded { border-color: var(--brand); box-shadow: 0 0 0 2px rgba(11,122,62,0.18); }
  .live-card:disabled { cursor: default; }
  .live-card:disabled:hover { border-color: var(--border); box-shadow: none; transform: none; }
  .device-panel {
    margin-top: 12px; background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; padding: 4px 12px; overflow-x: auto;
  }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

  .hero {
    background: var(--panel); border: 1px solid var(--border); border-left: 6px solid var(--border);
    border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px 22px; margin-bottom: 20px;
  }
  .hero-label { font-size: 12.5px; color: var(--text-dim); margin-bottom: 10px; font-weight: 600; }
  .hero-value { display: flex; align-items: center; flex-wrap: wrap; gap: 14px; margin-bottom: 10px; }
  .hero-pct { font-size: 44px; font-weight: 800; line-height: 1; letter-spacing: -0.03em; color: var(--brand-dark); }
  .hero-sub { font-size: 12px; color: var(--text-mute); }

  tr.period-row { cursor: pointer; }
  tr.period-row:hover td { background: #eef6f0; }
  tr.period-row.expanded td { background: #e6f2ea; border-bottom-color: #c6dccd; }
  tr.drill-row td { background: #fafcfb; color: var(--text-dim); font-size: 12px; }
  tr.drill-row:hover td { background: #f1f7f3; }
  .expand-arrow { display: inline-block; width: 10px; margin-right: 4px; color: var(--brand-2); }
  .section-note { font-size: 12px; color: var(--text-mute); margin: -4px 0 14px; max-width: 680px; line-height: 1.55; }

  @media (max-width: 640px) {
    .page { padding: 14px 16px 24px; }
    .topbar { position: relative; padding: 8px 16px; gap: 12px; flex-wrap: wrap; }
    .topbar img { height: 36px; }
    .topbar .titles { border-left: none; padding-left: 0; }
  }

  /* Highlighted sections: Live status + Network topology */
  section.featured { border: 1px solid #bcdcc6; box-shadow: 0 2px 4px rgba(10,60,30,0.06), 0 12px 30px rgba(10,92,46,0.10); position: relative; overflow: hidden; }
  section.featured::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 4px; background: linear-gradient(90deg, var(--brand-dark), var(--brand-2) 55%, var(--lime)); }
  section.featured h2 { font-size: 17px; }
  .live-pill { margin-left: 10px; display: inline-flex; align-items: center; gap: 6px; font-size: 10.5px; font-weight: 700; letter-spacing: 0.08em; color: var(--brand); background: rgba(31,157,77,0.10); border: 1px solid rgba(31,157,77,0.25); padding: 2px 8px; border-radius: 999px; }
  .live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--brand-2); box-shadow: 0 0 0 0 rgba(31,157,77,0.6); animation: livePulse 1.8s infinite; }
  @keyframes livePulse { 0% { box-shadow: 0 0 0 0 rgba(31,157,77,0.55); } 70% { box-shadow: 0 0 0 7px rgba(31,157,77,0); } 100% { box-shadow: 0 0 0 0 rgba(31,157,77,0); } }
  .mini-bar { height: 6px; border-radius: 999px; background: #e3eee6; overflow: hidden; margin-top: 8px; }
  .mini-bar span { display: block; height: 100%; border-radius: 999px; }
  .featured .card .value { font-size: 34px; }

  /* Topology: a dark forest-green control-room panel */
  .topo-panel { display: grid; grid-template-columns: minmax(0, 1fr) 270px; border-radius: 14px; overflow: hidden;
    background: radial-gradient(1200px 500px at 30% 0%, #145a33 0%, #0b3a21 45%, #072816 100%); color: #e6f4ea; }
  .topo-graph { padding: 10px 6px 8px; min-width: 0; position: relative; }
  .topo-graph svg { display: block; }
  .topo-label { font-size: 11.5px; font-weight: 600; fill: #d9f2e1; }
  .topo-sub { font-size: 10.5px; fill: #a3e635; }
  .topo-pct { font-weight: 800; fill: #ffffff; }
  .topo-count { font-size: 9.5px; fill: #9cc7aa; }
  .topo-zone { font-size: 11px; font-weight: 700; letter-spacing: 0.12em; fill: rgba(190,235,160,0.55); }

  .topo-cloud-link { cursor: pointer; outline: none; }
  .topo-cloud { transition: transform .25s cubic-bezier(.2,.8,.2,1.2); }
  .topo-cloud-glow { transition: fill-opacity .25s; }
  .topo-cloud-hint { font-size: 10.5px; font-weight: 700; fill: #a3e635; opacity: 0; transition: opacity .2s; }
  .topo-cloud-link:hover .topo-cloud, .topo-cloud-link:focus-visible .topo-cloud { transform: translateY(-6px) scale(1.12); animation: cloudBob 1.4s ease-in-out .25s infinite; }
  .topo-cloud-link:hover .topo-cloud-glow, .topo-cloud-link:focus-visible .topo-cloud-glow { fill-opacity: 0.18; }
  .topo-cloud-link:hover .topo-cloud-hint, .topo-cloud-link:focus-visible .topo-cloud-hint { opacity: 1; }
  @keyframes cloudBob { 0%, 100% { transform: translateY(-6px) scale(1.12); } 50% { transform: translateY(-10px) scale(1.12); } }

  .topo-graph { position: relative; }
  .topo-node { cursor: pointer; outline: none; }
  .topo-node:hover .topo-pct, .topo-node:focus-visible .topo-pct { fill: #d9f99d; }
  .topo-tip {
    position: absolute; z-index: 5; width: 270px; max-height: 300px; display: flex; flex-direction: column;
    background: rgba(255,255,255,0.10); -webkit-backdrop-filter: blur(10px) saturate(140%); backdrop-filter: blur(10px) saturate(140%);
    border: 1px solid rgba(217,249,157,0.30); border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.30);
    color: #f0fdf4; font-size: 12px; padding: 10px 4px 6px 12px;
  }
  .topo-tip[hidden] { display: none; }
  .topo-tip .tip-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 0 8px 7px 0; border-bottom: 1px solid rgba(217,249,157,0.20); margin-bottom: 4px; }
  .topo-tip .tip-head span { color: #bef264; font-size: 11px; font-weight: 600; }
  .topo-tip ul { list-style: none; margin: 0; padding: 0 8px 0 0; overflow-y: auto; }
  .topo-tip li { display: grid; grid-template-columns: 8px minmax(0, 1fr) auto auto; align-items: center; gap: 8px; padding: 3px 0; }
  .topo-tip .tip-dot { width: 7px; height: 7px; border-radius: 50%; background: #4ade80; }
  .topo-tip .tip-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .topo-tip .tip-meta { color: #a7cdb4; font-size: 10.5px; font-family: ui-monospace, Consolas, monospace; }
  .topo-tip .tip-status { font-size: 10.5px; color: #86efac; }
  .topo-tip li.down .tip-dot { background: #f87171; }
  .topo-tip li.down .tip-status, .topo-tip li.down .tip-name { color: #fecaca; font-weight: 600; }
  .topo-tip .tip-empty { color: #a7cdb4; padding: 4px 0 6px; }

  .topo-isp-v { font-size: 13px; font-weight: 800; fill: #bef264; }
  .topo-isp-v.up { fill: #86efac; }
  .topo-tip .tip-isp { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 6px 8px 8px 0; }
  .topo-tip .tip-isp div { background: rgba(255,255,255,0.06); border-radius: 8px; padding: 6px 8px; }
  .topo-tip .tip-isp span { display: block; font-size: 10.5px; color: #a7cdb4; }
  .topo-tip .tip-isp strong { font-size: 20px; font-weight: 800; color: #fff; }
  .topo-tip .tip-isp em { font-style: normal; font-size: 10.5px; color: #bef264; margin-left: 4px; }
  .topo-flow { animation: topoFlow 1.2s linear infinite; opacity: 0.75; }
  @keyframes topoFlow { to { stroke-dashoffset: -44; } }
  .topo-pulse { transform-box: fill-box; transform-origin: center; animation: topoPulse 1.8s ease-out infinite; }
  @keyframes topoPulse { 0% { opacity: 0.9; transform: scale(1); } 100% { opacity: 0; transform: scale(1.45); } }
  .topo-legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 11.5px; color: #b9dcc4; padding: 0 14px 6px; }
  .topo-legend span { display: inline-flex; align-items: center; gap: 6px; }
  .topo-legend i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  .topo-side { background: rgba(3,22,12,0.45); border-left: 1px solid rgba(163,230,53,0.15); padding: 18px 18px 14px; }
  .topo-side-title { font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #a3e635; margin-bottom: 10px; }
  .topo-tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .topo-tiles div { background: rgba(255,255,255,0.05); border: 1px solid rgba(163,230,53,0.15); border-radius: 10px; padding: 8px 6px; text-align: center; }
  .topo-tiles span { display: block; font-size: 10.5px; color: #9cc7aa; }
  .topo-tiles strong { font-size: 22px; font-weight: 800; color: #fff; }
  .topo-site { margin-bottom: 10px; }
  .topo-site-row { display: flex; justify-content: space-between; font-size: 12.5px; }
  .topo-bar { height: 6px; border-radius: 999px; background: rgba(255,255,255,0.08); overflow: hidden; margin: 5px 0 3px; }
  .topo-bar span { display: block; height: 100%; border-radius: 999px; }
  .topo-site-sub { font-size: 11px; color: #8fb99c; }
  .topo-down { list-style: none; margin: 0; padding: 0; font-size: 12px; max-height: 190px; overflow-y: auto; }
  .topo-down li { display: flex; align-items: center; gap: 8px; padding: 5px 0; border-bottom: 1px solid rgba(163,230,53,0.08); }
  .topo-down li em { margin-left: auto; font-style: normal; font-size: 10.5px; color: #8fb99c; }
  .topo-down li.none { color: #4ade80; border: none; }
  .topo-down li.more { color: #8fb99c; border: none; }
  .topo-dot { width: 7px; height: 7px; border-radius: 50%; background: #f87171; flex: none; }
  .topo-side-foot { margin-top: 12px; font-size: 10.5px; color: #7fa88c; }
  @media (max-width: 900px) { .topo-panel { grid-template-columns: minmax(0, 1fr); } .topo-side { border-left: none; border-top: 1px solid rgba(163,230,53,0.15); } }
  @media (prefers-reduced-motion: reduce) { .topo-pulse, .live-dot { animation: none; } }
</style>
</head>

<script>
// ---------------------------------------------------------------------------
// Config persistence — this file is meant to stay private (inside your
// repo / on your own machine), so it's fine to remember your settings in
// this browser via localStorage. Never host this file somewhere public,
// since the secret would be visible in the page once entered.
// ---------------------------------------------------------------------------
const $ = (id) => document.getElementById(id);

function loadSavedConfig() {
  try {
    const saved = JSON.parse(localStorage.getItem("bkNetworkDashboardConfig") || "{}");
    if (saved.url) $("cfg-url").value = saved.url;
    if (saved.secret) $("cfg-secret").value = saved.secret;
    if (saved.tab) $("cfg-tab").value = saved.tab;
  } catch (e) { /* ignore */ }
}
function saveConfig(cfg) {
  localStorage.setItem("bkNetworkDashboardConfig", JSON.stringify(cfg));
}
loadSavedConfig();

// The connection fields stay hidden behind the "Connection" link once saved;
// they open automatically only when something needs entering or fixing.
function showConfig(open) {
  $("config-panel").hidden = !open;
  $("cfg-toggle").setAttribute("aria-expanded", String(open));
}
$("cfg-toggle").addEventListener("click", () => showConfig($("config-panel").hidden));
if (!$("cfg-url").value || !$("cfg-secret").value) showConfig(true);

// ---------------------------------------------------------------------------
// LAG scorecard tiers — "Critical IT systems & connection uptime"
// Each tier's floor is the minimum uptime % required to reach it; a day
// that doesn't clear the Yellow floor (94%) falls to Red.
// ---------------------------------------------------------------------------
const TIERS = [
  { name: "Emerald", score: 5, min: 99.9, cls: "tier-emerald", color: "#047857" },
  { name: "SG",      score: 4, min: 99.5, cls: "tier-sg",      color: "#16a34a" },
  { name: "Green",   score: 3, min: 98,   cls: "tier-green",   color: "#65a30d" },
  { name: "Yellow",  score: 2, min: 94,   cls: "tier-yellow",  color: "#c27c0e" },
  { name: "Red",     score: 1, min: 0,    cls: "tier-red",     color: "#dc2626" },
];

function tierFor(uptimePct) {
  if (uptimePct === null || uptimePct === undefined || isNaN(uptimePct)) return null;
  for (const t of TIERS) {
    if (uptimePct >= t.min) return t;
  }
  return TIERS[TIERS.length - 1];
}

function tierBadge(tier) {
  if (!tier) return `<span class="badge tier-na"><span class="dot" style="background:#9aaba0"></span>No data</span>`;
  return `<span class="badge ${tier.cls}"><span class="dot" style="background:${tier.color}"></span>${tier.name}</span>`;
}

// ---------------------------------------------------------------------------
// Apps Script calls (plain GET — Apps Script web apps don't require CORS
// preflight for simple GET requests, so this works from any static page)
// ---------------------------------------------------------------------------
async function callAppsScript(url, secret, action, extraParams) {
  const params = new URLSearchParams({ action, secret, ...(extraParams || {}) });
  const resp = await fetch(`${url}?${params.toString()}`);
  if (!resp.ok) throw new Error(`HTTP ${resp.status} calling ${action}`);
  const data = await resp.json();
  if (data.error) throw new Error(`Apps Script error (${action}): ${data.error}`);
  return data;
}

// ---------------------------------------------------------------------------
// Parse the scoreboard tab: find the header row by matching known column
// labels, then map every subsequent row into a clean record. This doesn't
// assume fixed column letters, so it should keep working even if the sheet
// layout shifts.
// ---------------------------------------------------------------------------
function findHeaderRow(values) {
  const patterns = { date: /date/i, internet: /internet/i, ap: /access\s*points?/i,
                      switches: /switch/i, cctv: /cctv/i, bio: /biometric/i,
                      totalDT: /total.*dt|total.*downtime/i, uptime: /uptime/i,
                      towerDown: /tower.*down/i, towerUp: /tower.*up/i,
                      marilaoDown: /marilao.*down/i, marilaoUp: /marilao.*up/i,
                      kalayaanDown: /kalayaan.*down/i, kalayaanUp: /kalayaan.*up/i };
  let best = { rowIdx: -1, hits: 0, cols: {} };
  for (let r = 0; r < Math.min(values.length, 30); r++) {
    const cols = {};
    let hits = 0;
    values[r].forEach((cell, c) => {
      const text = String(cell || "");
      for (const key in patterns) {
        if (patterns[key].test(text) && cols[key] === undefined) {
          cols[key] = c;
          hits++;
        }
      }
    });
    if (hits > best.hits) best = { rowIdx: r, hits, cols };
  }
  return best.hits >= 3 ? best : null;
}

function parsePercent(raw) {
  if (raw === "" || raw === null || raw === undefined) return null;
  if (typeof raw === "string" && raw.trim().endsWith("%")) {
    const n = parseFloat(raw);
    return isNaN(n) ? null : n;
  }
  const n = parseFloat(raw);
  if (isNaN(n)) return null;
  return n <= 1 ? n * 100 : n; // handles 0.998 vs 99.8 style formatting
}

function parseNumber(raw) {
  if (raw === "" || raw === null || raw === undefined) return null;
  const n = parseFloat(raw);
  return isNaN(n) ? null : n;
}

// ---------------------------------------------------------------------------
// Remarks -- a separate, manually-typed sheet tab (Date | DT Start | DT End |
// Reason) where you log *why* something was down. This is a human judgment
// call UniFi's API can't provide, so unlike everything else on this
// dashboard it's entered by hand directly in Google Sheets. Multiple rows
// per date are fine -- a day can have more than one incident.
// ---------------------------------------------------------------------------
function findRemarksHeaderRow(values) {
  const patterns = { date: /date/i, dtStart: /start/i, dtEnd: /end/i, reason: /reason|remark/i };
  for (let r = 0; r < Math.min(values.length, 10); r++) {
    const cols = {};
    let hits = 0;
    (values[r] || []).forEach((cell, c) => {
      const text = String(cell || "");
      for (const key in patterns) {
        if (patterns[key].test(text) && cols[key] === undefined) { cols[key] = c; hits++; }
      }
    });
    if (hits >= 2) return { rowIdx: r, cols };
  }
  return null;
}

function parseRemarks(values) {
  if (!values || values.length < 2) return [];
  const header = findRemarksHeaderRow(values);
  if (!header) return [];
  const out = [];
  for (let r = header.rowIdx + 1; r < values.length; r++) {
    const row = values[r];
    const dateRaw = header.cols.date !== undefined ? row[header.cols.date] : "";
    const date = dateRaw ? String(dateRaw).slice(0, 10) : "";
    if (!date) continue;
    out.push({
      date,
      dtStart: header.cols.dtStart !== undefined ? String(row[header.cols.dtStart] || "") : "",
      dtEnd: header.cols.dtEnd !== undefined ? String(row[header.cols.dtEnd] || "") : "",
      reason: header.cols.reason !== undefined ? String(row[header.cols.reason] || "") : "",
    });
  }
  return out.sort((a, b) => a.date.localeCompare(b.date) || a.dtStart.localeCompare(b.dtStart));
}

function dateRangeOfRows(rows) {
  if (!rows || !rows.length) return { start: null, end: null };
  let start = rows[0].date, end = rows[0].date;
  rows.forEach((r) => { if (r.date < start) start = r.date; if (r.date > end) end = r.date; });
  return { start, end };
}

function remarksInRange(remarks, start, end) {
  if (!remarks || !start || !end) return [];
  return remarks.filter((r) => r.date >= start && r.date <= end);
}

// ---------------------------------------------------------------------------
// Manage devices -- backed by a "Devices" sheet tab that holds manual
// additions and overrides. UniFi APs/switches are discovered automatically
// by UniFi's API, so for them "remove" means "stop monitoring/counting this
// one" (Monitored = No) and "restore" flips it back. CCTV/Biometrics can be
// added, edited (name/IP/type) and removed. ping_devices.py and
// aggregate_daily.py read the same tab, so a change here affects polling and
// downtime, not just what's displayed.
// ---------------------------------------------------------------------------
function parseDevices(values) {
  if (!values || values.length < 2) return [];
  const header = (values[0] || []).map((h) => String(h || ""));
  const col = (re) => header.findIndex((h) => re.test(h));
  const idx = { name: col(/name/i), type: col(/type/i), host: col(/host/i), ip: col(/\bip\b/i),
                mac: col(/mac/i), monitored: col(/monitor/i), source: col(/source/i) };
  if (idx.name < 0 || idx.type < 0) return [];
  const get = (row, i) => (i >= 0 && row[i] !== undefined && row[i] !== null ? String(row[i]).trim() : "");
  const out = [];
  for (let r = 1; r < values.length; r++) {
    const row = values[r];
    const name = get(row, idx.name), type = get(row, idx.type);
    if (!name && !get(row, idx.mac)) continue;
    out.push({
      name, type, host: get(row, idx.host), ip: get(row, idx.ip), mac: get(row, idx.mac),
      monitored: get(row, idx.monitored).toLowerCase() !== "no",
      source: get(row, idx.source) || "Manual",
    });
  }
  return out;
}

async function saveDeviceRemote(d) {
  const url = $("cfg-url").value.trim();
  const secret = $("cfg-secret").value.trim();
  await callAppsScript(url, secret, "saveDevice", {
    name: d.name, type: d.type, host: d.host || "", ip: d.ip || "", mac: d.mac || "",
    monitored: d.monitored ? "Yes" : "No", source: d.source || "Manual",
  });
  const k = deviceKey(d.type, d.name, d.mac);
  const i = lastDevices.findIndex((x) => deviceKey(x.type, x.name, x.mac) === k);
  const rec = { name: d.name, type: d.type, host: d.host || "", ip: d.ip || "", mac: d.mac || "",
                monitored: !!d.monitored, source: d.source || "Manual" };
  if (i >= 0) lastDevices[i] = rec; else lastDevices.push(rec);
  lastLiveStatus = parseLiveStatus(lastRawRows, ignoredKeysFrom(lastDevices));
}

// ---------------------------------------------------------------------------
// Daily check-in -- a log of who reviewed the dashboard each business day.
// Stored in two sheet tabs: "Checkers" (Name | Active) is the list of people
// who can check in; "Checkins" (Date | Time | Name | Notes) is the log. Dates
// use the browser's LOCAL date (not UTC). Business days = Mon-Fri; a past
// business day with no check-in shows as Missed, today as Pending until
// someone checks in.
// ---------------------------------------------------------------------------
function localDateStr(d = new Date()) {
  const p = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}
function localTimeStr(d = new Date()) {
  const p = (n) => String(n).padStart(2, "0");
  return `${p(d.getHours())}:${p(d.getMinutes())}`;
}

function parseCheckins(values) {
  if (!values || values.length < 2) return [];
  const header = (values[0] || []).map((h) => String(h || ""));
  const col = (re) => header.findIndex((h) => re.test(h));
  const idx = { date: col(/date/i), time: col(/time/i), name: col(/name|who/i), notes: col(/note|remark/i) };
  if (idx.date < 0 || idx.name < 0) return [];
  const get = (row, i) => (i >= 0 && row[i] !== undefined && row[i] !== null ? String(row[i]).trim() : "");
  const out = [];
  for (let r = 1; r < values.length; r++) {
    const row = values[r];
    const date = get(row, idx.date).slice(0, 10);
    const name = get(row, idx.name);
    if (!date || !name) continue;
    out.push({ date, time: get(row, idx.time), name, notes: get(row, idx.notes) });
  }
  return out.sort((a, b) => a.date.localeCompare(b.date) || a.time.localeCompare(b.time));
}

function parseCheckers(values) {
  if (!values || values.length < 2) return [];
  const header = (values[0] || []).map((h) => String(h || ""));
  const iName = header.findIndex((h) => /name/i.test(h));
  const iActive = header.findIndex((h) => /active/i.test(h));
  if (iName < 0) return [];
  const out = [];
  for (let r = 1; r < values.length; r++) {
    const row = values[r];
    const name = row[iName] !== undefined && row[iName] !== null ? String(row[iName]).trim() : "";
    if (!name) continue;
    const active = iActive < 0 ? true : String(row[iActive] === undefined || row[iActive] === null ? "" : row[iActive]).trim().toLowerCase() !== "no";
    out.push({ name, active });
  }
  return out;
}

// Who is responsible for checking what on unifi.ui.com each business day.
const CHECK_ASSIGNMENTS = [
  { area: "ISPs", owner: "Jeff" },
  { area: "APs & Switches", owner: "Allen" },
  { area: "CCTV & Biometrics", owner: "Pao" },
];

// Daily checking starts on this date. Earlier business days are shown greyed
// out ("N/A") and are not counted as missed.
const CHECKS_START = "2026-10-07";

// Per-business-day check status for [start, end] (inclusive, YYYY-MM-DD).
// A day is Complete when every assigned person checked in, Partial when some
// did, Missed when nobody did (past days), Pending while today is unfinished.
function checkSummary(start, end) {
  const byOwner = {};
  CHECK_ASSIGNMENTS.forEach((a) => { byOwner[a.owner] = { area: a.area, done: 0, total: 0 }; });
  const empty = { rows: [], complete: 0, partial: 0, missed: 0, total: 0, byOwner };
  if (!start || !end) return empty;
  const today = localDateStr();
  const rows = [];
  let complete = 0, partial = 0, missed = 0;
  const d = new Date(`${start}T00:00:00`);
  const last = new Date(`${end}T00:00:00`);
  if (isNaN(d) || isNaN(last)) return empty;
  for (; d <= last; d.setDate(d.getDate() + 1)) {
    const dow = d.getDay();
    if (dow === 0 || dow === 6) continue; // business days only
    const ds = localDateStr(d);
    if (ds > today) break; // future days aren't due yet
    if (ds < CHECKS_START) {
      rows.push({ date: ds, status: "N/A", areas: CHECK_ASSIGNMENTS.map((a) => ({ area: a.area, owner: a.owner, status: "N/A", time: "" })), notes: "" });
      continue;
    }
    const mine = lastCheckins.filter((c) => c.date === ds);
    const areas = CHECK_ASSIGNMENTS.map((a) => {
      const hit = mine.filter((c) => c.name.toLowerCase() === a.owner.toLowerCase());
      const status = hit.length ? "Checked" : (ds < today ? "Missed" : "Pending");
      return { area: a.area, owner: a.owner, status, time: hit.map((c) => c.time).filter(Boolean).join(", ") };
    });
    const done = areas.filter((x) => x.status === "Checked").length;
    let status;
    if (done === areas.length) { status = "Complete"; complete++; }
    else if (ds === today) status = "Pending";
    else if (done === 0) { status = "Missed"; missed++; }
    else { status = "Partial"; partial++; }
    if (ds < today || status === "Complete") {
      areas.forEach((x) => { byOwner[x.owner].total++; if (x.status === "Checked") byOwner[x.owner].done++; });
    }
    rows.push({
      date: ds, status, areas,
      notes: mine.map((c) => c.notes ? `${c.name}: ${c.notes}` : "").filter(Boolean).join(" | "),
    });
  }
  return { rows, complete, partial, missed, total: complete + partial + missed, byOwner };
}

function checksOwnerText(sum) {
  return Object.keys(sum.byOwner).map((o) => `${o} (${sum.byOwner[o].area}) ${sum.byOwner[o].done}/${sum.byOwner[o].total}`).join(", ");
}

function renderChecksSummaryLine(sum) {
  if (!sum || !sum.total) return "";
  const color = (sum.missed || sum.partial) ? "var(--yellow)" : "var(--sg)";
  return `<div class="hero-sub" style="margin-top:10px;">Daily checks:
    <strong style="color:${color};">${sum.complete} of ${sum.total}</strong> business days fully checked${sum.partial ? ` &middot; ${sum.partial} partial` : ""}${sum.missed ? ` &middot; ${sum.missed} missed` : ""}
    <br>${escapeHtml(checksOwnerText(sum))}</div>`;
}

function renderChecksTable(sum) {
  if (!sum || !sum.rows.length) return "";
  const color = { Checked: "var(--sg)", Complete: "var(--sg)", Missed: "var(--red)", Partial: "var(--yellow)", Pending: "var(--text-mute)", "N/A": "var(--text-mute)" };
  const cell = (a) => `<td style="color:${color[a.status]};">${a.status === "Checked" ? "Checked" + (a.time ? " " + escapeHtml(a.time) : "") : a.status}</td>`;
  const heads = CHECK_ASSIGNMENTS.map((a) => `<th>${escapeHtml(a.area)} (${escapeHtml(a.owner)})</th>`).join("");
  const rows = sum.rows.map((r) => `<tr${r.status === "N/A" ? ' style="opacity:0.4;"' : ""}>
      <td>${escapeHtml(r.date)}</td>
      <td style="color:${color[r.status]};">${r.status}</td>
      ${r.areas.map(cell).join("")}
      <td>${escapeHtml(r.notes || "—")}</td>
    </tr>`).join("");
  return `<div class="hero-label" style="margin-top:14px;">Daily checks</div>
    ${renderChecksSummaryLine(sum)}
    <div style="overflow-x:auto; margin-top:6px;"><table>
      <thead><tr><th>Date</th><th>Overall</th>${heads}<th>Notes</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>`;
}

// Monthly daily-checking rate per person: this month so far + last month.
// Today only counts once that person has checked in, so an unfinished day
// never drags the rate down.
function pctColor(p) {
  if (p >= 90) return "var(--sg)";
  if (p >= 75) return "var(--yellow)";
  return "var(--red)";
}

function renderMonthlyCheckRates() {
  const now = new Date();
  const p = (n) => String(n).padStart(2, "0");
  const monthStr = (d) => `${d.getFullYear()}-${p(d.getMonth() + 1)}`;
  const thisStart = `${monthStr(now)}-01`;
  const prev = new Date(now.getFullYear(), now.getMonth() - 1, 1);
  const prevEnd = new Date(now.getFullYear(), now.getMonth(), 0);
  const months = [
    { label: now.toLocaleString("en-US", { month: "long", year: "numeric" }) + " (so far)", sum: checkSummary(thisStart, localDateStr(now)) },
    { label: prev.toLocaleString("en-US", { month: "long", year: "numeric" }), sum: checkSummary(localDateStr(prev), localDateStr(prevEnd)) },
  ];
  const cell = (o) => {
    if (!o || !o.total) return `<td style="color:var(--text-mute);">—</td>`;
    const pct = (o.done / o.total) * 100;
    return `<td><strong style="color:${pctColor(pct)}; font-size:15px;">${pct.toFixed(0)}%</strong>
      <span style="color:var(--text-mute); font-size:11px;"> ${o.done}/${o.total} days</span></td>`;
  };
  const rows = CHECK_ASSIGNMENTS.map((a) => `<tr>
      <td><strong>${escapeHtml(a.owner)}</strong> <span style="color:var(--text-mute); font-size:11px;">${escapeHtml(a.area)}</span></td>
      ${months.map((m) => cell(m.sum.byOwner[a.owner])).join("")}
    </tr>`).join("");
  return `<div class="hero-label" style="margin-top:14px;">Daily checking rate per month</div>
    <div style="overflow-x:auto; margin-top:6px;"><table>
      <thead><tr><th>Person</th>${months.map((m) => `<th>${escapeHtml(m.label)}</th>`).join("")}</tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
    <div style="font-size:11px; color:var(--text-mute); margin-top:4px;">Business days checked &divide; business days due. Green 90%+, yellow 75&ndash;89%, red below 75%.</div>`;
}

function renderRemarksTable(remarks) {
  if (!remarks || !remarks.length) {
